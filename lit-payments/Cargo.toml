[package]
name = "lit-payments"
version = "0.1.0"
edition = "2024"
description = "Lit Protocol ops-facing billing service: admin credit portal + LITKEY payments"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
alloy-dyn-abi = "1.0"
alloy-primitives = "1.0"
alloy-serde = "1.0"
hex = "0.4"
hmac = "0.12"
lit-billing-auth = { path = "../lit-billing-auth" }
lit-billing-core = { path = "../lit-billing-core" }
moka = { version = "0.12", features = ["future"] }
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
rocket = { version = "0.5.1", features = ["json", "secrets"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio",
    "uuid",
    "time",
    "macros",
] }
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
