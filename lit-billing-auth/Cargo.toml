[package]
name = "lit-billing-auth"
version = "0.1.0"
edition = "2024"
description = "Shared Rocket request guard + AuthResolver trait for Lit billing services"
license = "Apache-2.0"

[features]
default = []
# Provides the `OpenApiFromRequest` impl for the `BillingAuth` guard, used by
# services that mount the guard on okapi-documented routes (lit-api-server).
# Services without okapi (lit-payments) leave this off and depend on the bare
# Rocket guard only.
openapi = ["dep:rocket_okapi"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
rocket = { version = "0.5.1", features = ["json"] }
rocket_okapi = { version = "=0.9.0", optional = true }
schemars = { version = "0.8", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
base64_light = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
