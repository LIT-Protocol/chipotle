[package]
name = "lit-contracts-minimal-generator"
description = "Lit Blockchain"
authors = ["David Radunz <david.radunz@litprotocol.com>"]
version = "0.1.0"
edition = "2024"

[features]
default = []
env-override = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
alloy = { version = "1.0", features = [
    "contract",
    "dyn-abi",
    "json-abi",
    "network",
    "providers",
    "rpc-types",
    "signer-local",
    "sol-types",
] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"

[workspace]
