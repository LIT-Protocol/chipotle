name: Security Review (gated)

# Runs a Trail of Bits "differential-review" security analysis on every PR and
# GATES the merge: the job fails (red required check) when the review surfaces a
# CRITICAL or HIGH severity finding at MEDIUM+ confidence.
#
# Make this a required status check in branch protection (Settings -> Branches)
# so a failing review blocks merge.
#
# Security note: this uses `pull_request` (NOT `pull_request_target`), so secrets
# (including CLAUDE_CODE_OAUTH_TOKEN) are NOT exposed to forked-repo PRs. The
# review therefore cannot run on fork PRs; rather than fail closed and block them,
# the gate detects the fork case and passes with a notice (see "Evaluate gate").
# Same-repo (internal) PRs get the token, run the review, and are gated normally.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

jobs:
  security-review:
    # Skip draft PRs to save spend; they re-trigger on `ready_for_review`.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Gate policy (edit to taste). Findings matching BOTH lists block merge.
      GATE_SEVERITIES: "CRITICAL HIGH"
      GATE_MIN_CONFIDENCES: "HIGH MEDIUM"
      VERDICT_FILE: ".security-review/verdict.json"
    steps:
      - name: Checkout PR head (full history for git blame / regression detection)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"

      - name: Run differential security review
        id: review
        # Skip on forked-repo PRs: `pull_request` withholds secrets from forks, so
        # the token is empty and the review cannot run. The gate step handles the
        # fork case explicitly (passes with a notice) so forks are not blocked.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Broad read/write + Bash/Task so the skill can git-blame, grep the
          # codebase, delegate to the adversarial-modeler agent, and comment.
          claude_args: '--allowedTools "Read,Write,Edit,Grep,Glob,Bash,Task"'
          prompt: |
            You are running as a GATED, automated security reviewer on pull request
            #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Base SHA: ${{ github.event.pull_request.base.sha }}
            Head SHA: ${{ github.event.pull_request.head.sha }}
            The changes under review are: `git diff ${{ github.event.pull_request.base.sha }}...HEAD`

            TASK:
            1. Use the `differential-review` skill (vendored at
               `.claude/skills/differential-review/`) to perform a security-focused
               differential review of ONLY the changes in the diff range above.
               Follow its methodology: triage by risk, git-blame removed security
               code to catch regressions, calculate blast radius, and run the
               adversarial-modeler agent on any HIGH RISK change.
            2. Write the human-readable report to `.security-review/report.md`.
            3. Write a machine-readable verdict to `${{ env.VERDICT_FILE }}` EXACTLY
               matching this JSON schema (this file is REQUIRED — the CI gate fails
               closed if it is missing or unparseable):

               {
                 "schema_version": 1,
                 "head_sha": "<head sha>",
                 "base_sha": "<base sha>",
                 "summary": "<=400 char plain-English summary of risk posture",
                 "findings": [
                   {
                     "id": "F1",
                     "title": "short title",
                     "severity": "CRITICAL|HIGH|MEDIUM|LOW|INFO",
                     "confidence": "HIGH|MEDIUM|LOW",
                     "file": "path/to/file",
                     "line": 123,
                     "description": "what is wrong and why it is exploitable",
                     "recommendation": "concrete fix"
                   }
                 ],
                 "counts": {"CRITICAL":0,"HIGH":0,"MEDIUM":0,"LOW":0,"INFO":0}
               }

            SEVERITY/CONFIDENCE RULES:
            - Only assign HIGH/MEDIUM confidence when you have concrete evidence
              (line numbers + an attack scenario). Speculative concerns are LOW.
            - Doc-only / formatting / comment changes: emit zero findings.
            - Do NOT include a "gate" field; the gate is computed by CI from
              `findings` so it cannot be misjudged in prose.
            4. If you have write access, post a concise PR comment summarizing the
               verdict (counts + top findings). If commenting fails (e.g. fork PR),
               continue — do not error out.

            Output a one-line final message: "verdict written: N findings".

      - name: Evaluate gate
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_FILE: .github/workflows/security-review.yml
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          VERDICT="$VERDICT_FILE"

          # Forked-repo PRs: `pull_request` withholds secrets, so the review step
          # was skipped (no token). Do not fail closed — that would block every
          # fork PR. Pass with a notice; a maintainer can re-run from a same-repo
          # branch to get a gated review.
          if [ "$IS_FORK" = "true" ]; then
            echo "::notice title=Security review not gating (fork PR)::Secrets are unavailable to forked-repo PRs, so the automated review cannot run. Push the branch to this repository for a gated review."
            {
              echo "## 🔒 Security Review — skipped (fork PR)"
              echo ""
              echo "GitHub withholds secrets from forked-repo pull requests, so the"
              echo "automated reviewer could not run. This check does not block fork PRs."
              echo ""
              echo "A maintainer can re-run the review from a same-repo branch."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # anthropics/claude-code-action refuses to run ("workflow validation")
          # unless this workflow file is byte-identical to the copy on the default
          # branch — so the review CANNOT run on the PR that introduces or edits
          # this file (GitHub says as much: it "will begin working once you merge").
          # Failing closed there is a false positive that would make such PRs
          # unmergeable, so we detect that condition exactly as GitHub does and
          # pass with a notice. This adds no bypass: PRs touching CI workflows are
          # human-reviewed, and fork PRs cannot alter privileged workflows.
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH" 2>/dev/null || true
          review_skipped_reason=""
          if ! git cat-file -e "FETCH_HEAD:$WORKFLOW_FILE" 2>/dev/null; then
            review_skipped_reason="is not yet present on the default branch ($DEFAULT_BRANCH)"
          elif ! diff -q <(git show "FETCH_HEAD:$WORKFLOW_FILE") "$WORKFLOW_FILE" >/dev/null 2>&1; then
            review_skipped_reason="differs from the copy on the default branch ($DEFAULT_BRANCH)"
          fi

          if [ -n "$review_skipped_reason" ]; then
            echo "::notice title=Security review not gating yet::Workflow file $review_skipped_reason; GitHub blocks claude-code-action here. The gate enforces once this workflow is on $DEFAULT_BRANCH."
            {
              echo "## 🔒 Security Review — skipped (not gating yet)"
              echo ""
              echo "\`claude-code-action\` cannot run because this workflow file $review_skipped_reason."
              echo "This is expected on the PR that adds or edits the review workflow itself."
              echo ""
              echo "**Merge this PR; the gate enforces automatically on subsequent PRs.**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ ! -f "$VERDICT" ]; then
            echo "::error title=Security review incomplete::No verdict file at $VERDICT. Failing closed."
            {
              echo "## 🔒 Security Review — FAILED (incomplete)"
              echo ""
              echo "The reviewer did not produce \`$VERDICT\`. Re-run the job; if it"
              echo "keeps failing, inspect the **Run differential security review** step logs."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! jq -e . "$VERDICT" >/dev/null 2>&1; then
            echo "::error title=Security review invalid::$VERDICT is not valid JSON. Failing closed."
            exit 1
          fi

          # Schema validation (fail closed on anything unexpected). Valid-but-empty
          # JSON like `{}` must NOT be treated as "0 findings" — require a
          # `findings` array and, for every entry, a recognized severity AND
          # confidence enum. A finding with a bogus/missing severity would silently
          # evade the blocking filter below, so reject the whole verdict instead.
          if ! jq -e '
            (type == "object")
            and ((.findings | type) == "array")
            and (all(.findings[]?;
                  (.severity   as $s | ["CRITICAL","HIGH","MEDIUM","LOW","INFO"] | index($s))
              and (.confidence as $c | ["HIGH","MEDIUM","LOW"] | index($c))))
          ' "$VERDICT" >/dev/null 2>&1; then
            echo "::error title=Security review invalid::$VERDICT failed schema validation (needs a findings[] array with a valid severity + confidence on every entry). Failing closed."
            {
              echo "## 🔒 Security Review — FAILED (invalid verdict)"
              echo ""
              echo "The verdict file did not match the required schema. Failing closed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Gate policy: severity in [$GATE_SEVERITIES] AND confidence in [$GATE_MIN_CONFIDENCES] blocks merge."

          # Split the space-separated env lists inside jq so the logic does not
          # depend on shell word-splitting behavior.
          blocking=$(jq --arg sev "$GATE_SEVERITIES" --arg conf "$GATE_MIN_CONFIDENCES" '
            ($sev | split(" ")) as $S | ($conf | split(" ")) as $C |
            [.findings[]? | select((.severity as $s | $S | index($s)) and (.confidence as $c | $C | index($c)))]' \
            "$VERDICT")
          blocking_count=$(echo "$blocking" | jq 'length')
          total=$(jq '.findings | length' "$VERDICT")
          summary=$(jq -r '.summary // "(no summary)"' "$VERDICT")

          {
            echo "## 🔒 Security Review"
            echo ""
            echo "$summary"
            echo ""
            echo "**Findings:** $total total · **$blocking_count blocking** (severity ∈ {$GATE_SEVERITIES}, confidence ∈ {$GATE_MIN_CONFIDENCES})"
            echo ""
            if [ "$total" -gt 0 ]; then
              echo "| Severity | Confidence | File:Line | Title |"
              echo "|---|---|---|---|"
              jq -r '.findings[]? | "| \(.severity) | \(.confidence) | \(.file // "?"):\(.line // "?") | \(.title) |"' "$VERDICT"
              echo ""
            fi
            echo "<details><summary>Full report</summary>"
            echo ""
            echo '```'
            [ -f .security-review/report.md ] && cat .security-review/report.md || echo "(report.md not produced)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$blocking_count" -gt 0 ]; then
            echo "::error title=Security gate failed::$blocking_count blocking finding(s). See job summary / PR comment."
            exit 1
          fi
          echo "Security gate passed: no blocking findings."
