name: Security Review (manual)

# Runs a Trail of Bits "differential-review" security analysis ON DEMAND against a
# chosen branch. This is NOT a merge gate — it no longer triggers on pull requests.
# Trigger it from the Actions tab ("Run workflow") and pick a branch; it diffs that
# branch against the default branch (merge-base) and reports findings.
#
# The job still "fails" (red run) when the review surfaces a CRITICAL or HIGH
# severity finding at MEDIUM+ confidence, so a manual run gives a clear pass/fail
# signal — but nothing is blocked automatically.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to review (diffed against the default branch)"
        required: true
        default: "main"

concurrency:
  group: security-review-${{ github.event.inputs.branch }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  security-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Gate policy (edit to taste). Findings matching BOTH lists mark the run failed.
      GATE_SEVERITIES: "CRITICAL HIGH"
      GATE_MIN_CONFIDENCES: "HIGH MEDIUM"
      VERDICT_FILE: ".security-review/verdict.json"
    steps:
      - name: Checkout selected branch (full history for git blame / regression detection)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Resolve diff range (branch vs default branch merge-base)
        id: range
        env:
          BRANCH: ${{ github.event.inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          HEAD_SHA=$(git rev-parse HEAD)
          # Base = merge-base against the default branch. When reviewing the default
          # branch itself this equals HEAD, so the diff is empty (zero findings).
          BASE_SHA=$(git merge-base HEAD FETCH_HEAD)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Reviewing $BRANCH ($HEAD_SHA) against $DEFAULT_BRANCH merge-base ($BASE_SHA)."

      - name: Clear any pre-committed verdict (prevent fail-open)
        run: |
          set -euo pipefail
          # The gate reads the verdict from the working tree. A verdict committed
          # INTO the branch would let planted findings satisfy the gate whenever the
          # review step fails/times out. Refuse a tracked .security-review/ and wipe
          # any working-tree copy so the gate only reads THIS run's fresh output.
          if [ -n "$(git ls-files .security-review)" ]; then
            echo "::error title=Security review::.security-review/ is generated by CI and must not be committed. Remove it from the branch."
            exit 1
          fi
          rm -rf .security-review

      - name: Run differential security review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Broad read/write + Bash/Task so the skill can git-blame, grep the
          # codebase, and delegate to the adversarial-modeler agent.
          claude_args: '--allowedTools "Read,Write,Edit,Grep,Glob,Bash,Task"'
          prompt: |
            You are running as an automated security reviewer on branch
            `${{ github.event.inputs.branch }}` in ${{ github.repository }}.

            Base SHA: ${{ steps.range.outputs.base_sha }}
            Head SHA: ${{ steps.range.outputs.head_sha }}
            The changes under review are: `git diff ${{ steps.range.outputs.base_sha }}...${{ steps.range.outputs.head_sha }}`

            TASK:
            1. Use the `differential-review` skill (vendored at
               `.claude/skills/differential-review/`) to perform a security-focused
               differential review of ONLY the changes in the diff range above.
               Follow its methodology: triage by risk, git-blame removed security
               code to catch regressions, calculate blast radius, and run the
               adversarial-modeler agent on any HIGH RISK change.
            2. Write the human-readable report to `.security-review/report.md`.
            3. Write a machine-readable verdict to `${{ env.VERDICT_FILE }}` EXACTLY
               matching this JSON schema (this file is REQUIRED — the CI gate fails
               closed if it is missing or unparseable):

               {
                 "schema_version": 1,
                 "head_sha": "<head sha>",
                 "base_sha": "<base sha>",
                 "summary": "<=400 char plain-English summary of risk posture",
                 "findings": [
                   {
                     "id": "F1",
                     "title": "short title",
                     "severity": "CRITICAL|HIGH|MEDIUM|LOW|INFO",
                     "confidence": "HIGH|MEDIUM|LOW",
                     "file": "path/to/file",
                     "line": 123,
                     "description": "what is wrong and why it is exploitable",
                     "recommendation": "concrete fix"
                   }
                 ]
               }

            SEVERITY/CONFIDENCE RULES:
            - Only assign HIGH/MEDIUM confidence when you have concrete evidence
              (line numbers + an attack scenario). Speculative concerns are LOW.
            - Doc-only / formatting / comment changes: emit zero findings.
            - Do NOT include a "gate" field; the gate is computed by CI from
              `findings` so it cannot be misjudged in prose.

            Output a one-line final message: "verdict written: N findings".

      - name: Evaluate gate
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          VERDICT="$VERDICT_FILE"

          if [ ! -f "$VERDICT" ]; then
            echo "::error title=Security review incomplete::No verdict file at $VERDICT. Failing closed."
            {
              echo "## 🔒 Security Review — FAILED (incomplete)"
              echo ""
              echo "The reviewer did not produce \`$VERDICT\`. Re-run the job; if it"
              echo "keeps failing, inspect the **Run differential security review** step logs."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! jq -e . "$VERDICT" >/dev/null 2>&1; then
            echo "::error title=Security review invalid::$VERDICT is not valid JSON. Failing closed."
            exit 1
          fi

          # Schema validation (fail closed on anything unexpected). Valid-but-empty
          # JSON like `{}` must NOT be treated as "0 findings" — require a
          # `findings` array and, for every entry, a recognized severity AND
          # confidence enum. A finding with a bogus/missing severity would silently
          # evade the blocking filter below, so reject the whole verdict instead.
          if ! jq -e '
            (type == "object")
            and ((.findings | type) == "array")
            and (all(.findings[]?;
                  (.severity   as $s | ["CRITICAL","HIGH","MEDIUM","LOW","INFO"] | index($s))
              and (.confidence as $c | ["HIGH","MEDIUM","LOW"] | index($c))))
          ' "$VERDICT" >/dev/null 2>&1; then
            echo "::error title=Security review invalid::$VERDICT failed schema validation (needs a findings[] array with a valid severity + confidence on every entry). Failing closed."
            {
              echo "## 🔒 Security Review — FAILED (invalid verdict)"
              echo ""
              echo "The verdict file did not match the required schema. Failing closed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Gate policy: severity in [$GATE_SEVERITIES] AND confidence in [$GATE_MIN_CONFIDENCES] marks the run failed."

          # Split the space-separated env lists inside jq so the logic does not
          # depend on shell word-splitting behavior.
          blocking=$(jq --arg sev "$GATE_SEVERITIES" --arg conf "$GATE_MIN_CONFIDENCES" '
            ($sev | split(" ")) as $S | ($conf | split(" ")) as $C |
            [.findings[]? | select((.severity as $s | $S | index($s)) and (.confidence as $c | $C | index($c)))]' \
            "$VERDICT")
          blocking_count=$(echo "$blocking" | jq 'length')
          total=$(jq '.findings | length' "$VERDICT")
          summary=$(jq -r '.summary // "(no summary)"' "$VERDICT")

          {
            echo "## 🔒 Security Review — branch \`$BRANCH\`"
            echo ""
            echo "$summary"
            echo ""
            echo "**Findings:** $total total · **$blocking_count blocking** (severity ∈ {$GATE_SEVERITIES}, confidence ∈ {$GATE_MIN_CONFIDENCES})"
            echo ""
            if [ "$total" -gt 0 ]; then
              echo "| Severity | Confidence | File:Line | Title |"
              echo "|---|---|---|---|"
              # Escape pipes in model-authored strings so they can't break the table.
              jq -r '.findings[]? | ([.severity, .confidence, "\(.file // "?"):\(.line // "?")", (.title // "")] | map(gsub("\\|"; "\\|")) | "| \(.[0]) | \(.[1]) | \(.[2]) | \(.[3]) |")' "$VERDICT"
              echo ""
            fi
            echo "<details><summary>Full report</summary>"
            echo ""
            echo '```'
            [ -f .security-review/report.md ] && cat .security-review/report.md || echo "(report.md not produced)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$blocking_count" -gt 0 ]; then
            echo "::error title=Security gate failed::$blocking_count blocking finding(s). See job summary."
            exit 1
          fi
          echo "Security gate passed: no blocking findings."
