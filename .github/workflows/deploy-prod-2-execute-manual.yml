# Phase 2: Verify Safe-approved compose hash and commit the Phala CVM deployment.
#
# This workflow runs AFTER Safe multisig signers have approved AND executed the
# addComposeHash transaction proposed by Phase 1 (deploy-prod-1-propose.yml). It:
#   1. Downloads the deployment context from the Phase 1 draft release
#   2. Verifies the Safe transaction was executed on-chain and extracts the tx hash
#   3. Commits the Phala deployment using the on-chain tx hash
#   4. Runs the full verification suite (attestation, OpenAPI, k6)
#   5. Publishes the draft GitHub release created by Phase 1
#
# Required secrets:
#   PHALA_CLOUD_API_KEY - From Phala Cloud Dashboard > API Tokens

name: "Deploy Prod 2: Execute and Verify"

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag from Phase 1 (e.g. v1.2.3)"
        required: true
        type: string
      safe_tx_hash:
        description: "Safe transaction hash (from Phase 1 output, for verification)"
        required: true
        type: string

concurrency:
  group: deploy-phala-prod
  cancel-in-progress: false

jobs:
  trigger-static-deploy:
    needs: [publish-release]
    runs-on: self-hosted
    steps:
      - name: Trigger static site deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run "Deploy Prod 3: Static Site" \
            -f version_tag="${{ inputs.version_tag }}"

  download-context:
    runs-on: self-hosted
    outputs:
      compose_hash: ${{ steps.read.outputs.compose_hash }}
      safe_tx_hash: ${{ steps.read.outputs.safe_tx_hash }}
      phala_app_name: ${{ steps.read.outputs.phala_app_name }}
      base_url: ${{ steps.read.outputs.base_url }}
      api_root_url: ${{ steps.read.outputs.api_root_url }}
      safe_address: ${{ steps.read.outputs.safe_address }}
      version_tag: ${{ steps.read.outputs.version_tag }}
      source_sha: ${{ steps.read.outputs.source_sha }}
      encrypted_env: ${{ steps.read.outputs.encrypted_env }}
      app_auth_address: ${{ steps.read.outputs.app_auth_address }}
      provision_hash: ${{ steps.read.outputs.provision_hash }}
      previous_cvm: ${{ steps.read.outputs.previous_cvm }}
      bootstrap: ${{ steps.read.outputs.bootstrap }}
      context_sha: ${{ steps.read.outputs.context_sha }}
    steps:
      - name: Install GitHub CLI
        run: |
          if command -v gh &> /dev/null; then exit 0; fi
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update && sudo apt-get install -y gh

      - name: Clean up stale artifacts from previous runs
        run: rm -f deploy-context.json

      - name: Download deployment context from Phase 1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "${{ inputs.version_tag }}" \
            --pattern "deploy-context.json"

      - name: Read deployment context
        id: read
        run: |
          echo "context_sha=$(sha256sum deploy-context.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          jq -e '.selection | (.previous | type == "string") and (.target | type == "string") and (.bootstrap | type == "boolean")' deploy-context.json
          echo "previous_cvm=$(jq -r .selection.previous deploy-context.json)" >> "$GITHUB_OUTPUT"
          echo "bootstrap=$(jq -r .selection.bootstrap deploy-context.json)" >> "$GITHUB_OUTPUT"
          for key in compose_hash provision_hash safe_tx_hash phala_app_name base_url api_root_url safe_address app_auth_address version_tag source_sha encrypted_env; do
            val=$(jq -r ".$key" deploy-context.json)
            echo "$key=$val" >> "$GITHUB_OUTPUT"
          done

      - name: Verify safe_tx_hash matches
        run: |
          if [ "${{ steps.read.outputs.safe_tx_hash }}" != "${{ inputs.safe_tx_hash }}" ]; then
            echo "::error::safe_tx_hash mismatch: artifact=${{ steps.read.outputs.safe_tx_hash }} input=${{ inputs.safe_tx_hash }}"
            exit 1
          fi
          echo "safe_tx_hash verified: ${{ inputs.safe_tx_hash }}"

  execute-safe-tx:
    needs: [download-context]
    runs-on: self-hosted
    outputs:
      tx_hash: ${{ steps.execute.outputs.tx_hash }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install contract dependencies
        working-directory: lit-api-server/blockchain/lit_node_express
        run: npm ci

      - name: Compile contracts
        working-directory: lit-api-server/blockchain/lit_node_express
        run: npx hardhat compile

      - name: Verify Safe transaction was executed
        id: execute
        working-directory: lit-api-server/blockchain/lit_node_express
        run: |
          OUTPUT=$(npx hardhat execute-safe-tx \
            --network base \
            --safe "${{ needs.download-context.outputs.safe_address }}" \
            --safe-tx-hash "${{ needs.download-context.outputs.safe_tx_hash }}" \
            2>&1 | tee /dev/stderr)
          TX_HASH=$(echo "$OUTPUT" | grep '^TX_HASH=' | cut -d= -f2)
          if [ -z "$TX_HASH" ]; then
            echo "::error::Failed to extract TX_HASH from execute-safe-tx output"
            exit 1
          fi
          echo "tx_hash=$TX_HASH" >> "$GITHUB_OUTPUT"

  verify-compose-hash-onchain:
    needs: [download-context, execute-safe-tx]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install contract dependencies
        working-directory: lit-api-server/blockchain/lit_node_express
        run: npm ci

      - name: Compile contracts
        working-directory: lit-api-server/blockchain/lit_node_express
        run: npx hardhat compile

      - name: Verify compose hash is whitelisted on-chain
        working-directory: lit-api-server/blockchain/lit_node_express
        run: |
          npx hardhat verify-compose-hash \
            --network base \
            --app-auth "${{ needs.download-context.outputs.app_auth_address }}" \
            --compose-hash "${{ needs.download-context.outputs.compose_hash }}"

  commit-deploy:
    outputs:
      mutation_started: ${{ steps.mutation.outputs.started }}
    environment: production
    needs: [download-context, verify-compose-hash-onchain]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Phala CLI
        run: npm install -g phala@1.2.4

      - name: Verify system Python
        run: python3 -c 'import sys; assert sys.version_info >= (3, 9)'

      - name: Revalidate the approved target snapshot before committing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version_tag }}
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          PROD_APP_ID: ${{ vars.APP_AUTH_ADDRESS_CHIPOTLE_PROD }}
          EXPECTED_TARGET: ${{ needs.download-context.outputs.phala_app_name }}
          EXPECTED_HASH: ${{ needs.download-context.outputs.provision_hash }}
          EXPECTED_SAFE_TX: ${{ needs.download-context.outputs.safe_tx_hash }}
          EXPECTED_CONTEXT_SHA: ${{ needs.download-context.outputs.context_sha }}
        run: |
          gh release download "$RELEASE_TAG" --pattern deploy-context.json --clobber
          test "$(sha256sum deploy-context.json | cut -d' ' -f1)" = "$EXPECTED_CONTEXT_SHA"
          jq -e --arg target "$EXPECTED_TARGET" --arg hash "$EXPECTED_HASH" --arg safe "$EXPECTED_SAFE_TX" \
            '.phala_app_name == $target and .provision_hash == $hash and .safe_tx_hash == $safe' deploy-context.json
          python3 scripts/phala-prod-target.py validate deploy-context.json

      - name: Record mutation boundary
        id: mutation
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Commit deployment to Phala (phase 2)
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          PROVISION_HASH: ${{ needs.download-context.outputs.provision_hash }}
          ENCRYPTED_ENV: ${{ needs.download-context.outputs.encrypted_env }}
          PHALA_APP_NAME: ${{ needs.download-context.outputs.phala_app_name }}
        run: |
          # Commit the provisioned compose file update using the PROVISION hash
          # (not the client-side compose_hash). The provision_hash is the value
          # returned by the Phala provision API and serves as a reference key
          # for the PATCH call. The client-side compose_hash (which matches
          # what the CVM will compute) was used for the Safe proposal.
          #
          # The encrypted_env (hex blob, sealed to the CVM's X25519 key) and
          # env_keys are sent alongside the hash so that the CVM's encrypted
          # environment is updated atomically with the compose file.
          COMMIT_PAYLOAD=$(mktemp)
          trap 'rm -f "$COMMIT_PAYLOAD"' EXIT

          ENV_KEYS='["STRIPE_SECRET_KEY","STRIPE_PUBLISHABLE_KEY","GCP_SERVICE_ACCOUNT_JSON","GCP_PROJECT_ID","BASE_CHAIN_RPC","CERTBOT_DOMAIN","CERTBOT_AWS_ACCESS_KEY_ID","CERTBOT_AWS_SECRET_ACCESS_KEY","CERTBOT_AWS_ROLE_ARN","CERTBOT_AWS_REGION","LIT_INTERNAL_SHARED_SECRET","PHALA_CVM_NAME","NEW_ACCOUNT_RATE_LIMIT_ENABLED"]'

          jq -n \
            --arg hash "$PROVISION_HASH" \
            --arg env "$ENCRYPTED_ENV" \
            --argjson keys "$ENV_KEYS" \
            '{
              compose_hash: $hash,
              encrypted_env: $env,
              env_keys: $keys,
              update_env_vars: true
            }' > "$COMMIT_PAYLOAD"

          phala api "/cvms/$PHALA_APP_NAME/compose_file" \
            -X PATCH \
            --input "$COMMIT_PAYLOAD" \
            --json

      - name: Start updated CVM if stopped
        shell: bash
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          PHALA_APP_NAME: ${{ needs.download-context.outputs.phala_app_name }}
        run: |
          # Updates preserve the VM's power state. Wait for the update to settle
          # before starting a stopped target; leave running instances alone.
          for attempt in {1..60}; do
            STATUS=$(phala cvms get "$PHALA_APP_NAME" --json | jq -er '.status')
            case "$STATUS" in
              stopped)
                phala cvms start "$PHALA_APP_NAME"
                exit 0
                ;;
              running) exit 0 ;;
              starting|stopping|updating|restarting|processing) sleep 5 ;;
              *)
                echo "::error::Unexpected CVM status '$STATUS' for '$PHALA_APP_NAME'"
                exit 1
                ;;
            esac
          done
          echo "::error::Timed out waiting for '$PHALA_APP_NAME' to settle after update"
          exit 1

  wait-for-api-available:
    needs: [commit-deploy, download-context]
    uses: ./.github/workflows/wait-for-api-restart.yml
    with:
      phala_app_name: ${{ needs.download-context.outputs.phala_app_name }}
      expected_cvm_name: ${{ needs.download-context.outputs.phala_app_name }}
      expected_sha: ${{ needs.download-context.outputs.source_sha }}
      runner: '["self-hosted"]'
    secrets:
      PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}

  verify-attestation:
    needs: [wait-for-api-available, download-context]
    uses: ./.github/workflows/verify-attestation.yml
    with:
      base_url: ${{ needs.wait-for-api-available.outputs.base_url }}
      runner: '["self-hosted"]'

  openapi-spec-check:
    needs: [wait-for-api-available]
    uses: ./.github/workflows/openapi-spec-check.yml
    with:
      api_root_url: ${{ needs.wait-for-api-available.outputs.api_root_url }}
      runner: '["self-hosted"]'

  k6-smoke:
    needs: [wait-for-api-available, openapi-spec-check]
    uses: ./.github/workflows/k6-smoke.yml
    with:
      api_root_url: ${{ needs.wait-for-api-available.outputs.api_root_url }}
      env: prod
    secrets:
      accounts_json: ${{ secrets.K6_ACCOUNTS_PROD_JSON }}

  k6-correctness:
    needs: [wait-for-api-available, k6-smoke]
    uses: ./.github/workflows/k6-correctness.yml
    with:
      api_root_url: ${{ needs.wait-for-api-available.outputs.api_root_url }}
      env: prod
    secrets:
      accounts_json: ${{ secrets.K6_ACCOUNTS_PROD_JSON }}

  # Publish the draft GitHub release created by Phase 1 after all verification passes.
  publish-release:
    if: needs.download-context.outputs.version_tag != ''
    needs: [download-context, retire-previous]
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Install GitHub CLI
        run: |
          if command -v gh &> /dev/null; then exit 0; fi
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update && sudo apt-get install -y gh

      - name: Publish draft release and remove deployment context asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete-asset "${{ needs.download-context.outputs.version_tag }}" deploy-context.json --yes || true
          gh release edit "${{ needs.download-context.outputs.version_tag }}" --draft=false

  confirm-cutover:
    needs: [download-context, wait-for-api-available, verify-attestation, openapi-spec-check, k6-smoke, k6-correctness]
    uses: ./.github/workflows/wait-for-api-restart.yml
    with:
      api_root_url: ${{ needs.download-context.outputs.api_root_url }}
      expected_sha: ${{ needs.download-context.outputs.source_sha }}
      expected_cvm_name: ${{ needs.download-context.outputs.phala_app_name }}
      timeout: 300

  retire-previous:
    needs: [download-context, confirm-cutover]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g phala@1.2.4
      - name: Retire verified previous replica
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          OLD: ${{ needs.download-context.outputs.previous_cvm }}
          NEW: ${{ needs.download-context.outputs.phala_app_name }}
          PUBLIC_URL: ${{ needs.download-context.outputs.base_url }}
        run: python3 scripts/phala-pingpong.py retire "$OLD" "$NEW" "$PUBLIC_URL"

  rollback-on-failure:
    needs: [download-context, commit-deploy, wait-for-api-available, verify-attestation, openapi-spec-check, k6-smoke, k6-correctness, confirm-cutover, retire-previous]
    if: >-
      ${{ always() && needs.download-context.result == 'success'
          && needs.commit-deploy.outputs.mutation_started == 'true'
          && (needs.commit-deploy.result == 'failure'
              || needs.wait-for-api-available.result == 'failure'
              || needs.verify-attestation.result == 'failure'
              || needs.openapi-spec-check.result == 'failure'
              || needs.k6-smoke.result == 'failure'
              || needs.k6-correctness.result == 'failure'
              || needs.confirm-cutover.result == 'failure'
              || needs.retire-previous.result == 'failure') }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g phala@1.2.4
      - name: Require recovery tools
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 9)'
          if ! command -v aws >/dev/null 2>&1; then
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            curl -fsSL --retry 3 "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "$tmp/awscliv2.zip"
            unzip -q "$tmp/awscliv2.zip" -d "$tmp"
            "$tmp/aws/install" --update --install-dir "$HOME/.local/aws-cli" --bin-dir "$HOME/.local/bin"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Recover previous authorized deployment
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CERTBOT_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CERTBOT_AWS_SECRET_ACCESS_KEY }}
          CERTBOT_AWS_ROLE_ARN: ${{ secrets.CERTBOT_AWS_ROLE_ARN }}
          AWS_DEFAULT_REGION: ${{ vars.CERTBOT_AWS_REGION }}
          OLD: ${{ needs.download-context.outputs.previous_cvm }}
          NEW: ${{ needs.download-context.outputs.phala_app_name }}
          PUBLIC_URL: ${{ needs.download-context.outputs.base_url }}
          BOOTSTRAP: ${{ needs.download-context.outputs.bootstrap }}
        run: |
          ACTION=rollback
          if [ "$BOOTSTRAP" = "true" ]; then ACTION=rollback-bootstrap; fi
          python3 scripts/phala-pingpong.py "$ACTION" "$OLD" "$NEW" "$PUBLIC_URL"
