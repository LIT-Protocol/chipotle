# Phase 2: Verify Safe-approved compose hash and commit the Phala CVM deployment.
#
# This workflow runs AFTER Safe multisig signers have approved AND executed the
# addComposeHash transaction proposed by Phase 1 (deploy-prod-1-propose.yml). It:
#   1. Downloads the deployment context from the Phase 1 draft release
#   2. Verifies the Safe transaction was executed on-chain and extracts the tx hash
#   3. Commits the Phala deployment using the on-chain tx hash
#   4. Runs the full verification suite (attestation, OpenAPI, k6)
#   5. Publishes the draft GitHub release created by Phase 1
#
# Required secrets:
#   PHALA_CLOUD_API_KEY - From Phala Cloud Dashboard > API Tokens

name: "Deploy Prod 2: Execute and Verify"

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag from Phase 1 (e.g. v1.2.3)"
        required: true
        type: string
      safe_tx_hash:
        description: "Safe transaction hash (from Phase 1 output, for verification)"
        required: true
        type: string
      lane:
        description: "Lane to deploy. Each lane of a release has its own Safe transaction and is executed by its own run of this workflow."
        required: false
        type: choice
        options: [legacy, v2]
        default: legacy

# Per lane: the lanes of a release are separate replicas and hostnames.
concurrency:
  group: deploy-phala-execute-${{ inputs.lane || 'legacy' }}
  cancel-in-progress: false

jobs:
  trigger-static-deploy:
    # Once per release, not once per lane: with the legacy lane's run, or with
    # the v2 run once the legacy lane is retired.
    if: ${{ inputs.lane != 'v2' || vars.PROD_LEGACY_LANE_RETIRED == 'true' }}
    runs-on: self-hosted
    steps:
      - name: Trigger static site deploy
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run "Deploy Prod 3: Static Site" \
            -f version_tag="$VERSION_TAG"

  download-context:
    runs-on: self-hosted
    outputs:
      compose_hash: ${{ steps.read.outputs.compose_hash }}
      safe_tx_hash: ${{ steps.read.outputs.safe_tx_hash }}
      phala_app_name: ${{ steps.read.outputs.phala_app_name }}
      base_url: ${{ steps.read.outputs.base_url }}
      api_root_url: ${{ steps.read.outputs.api_root_url }}
      safe_address: ${{ steps.read.outputs.safe_address }}
      version_tag: ${{ steps.read.outputs.version_tag }}
      source_sha: ${{ steps.read.outputs.source_sha }}
      encrypted_env: ${{ steps.read.outputs.encrypted_env }}
      app_auth_address: ${{ steps.read.outputs.app_auth_address }}
      provision_hash: ${{ steps.read.outputs.provision_hash }}
      env_keys: ${{ steps.read.outputs.env_keys }}
      replicas: ${{ steps.read.outputs.replicas }}
      expected_cvm_name: ${{ steps.read.outputs.expected_cvm_name }}
      ingress: ${{ steps.read.outputs.ingress }}
    steps:
      - name: Install GitHub CLI
        run: |
          if command -v gh &> /dev/null; then exit 0; fi
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update && sudo apt-get install -y gh

      - name: Clean up stale artifacts from previous runs
        run: rm -f deploy-context.json deploy-context-v2.json

      - name: Download deployment context from Phase 1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CONTEXT_ASSET: ${{ inputs.lane == 'v2' && 'deploy-context-v2.json' || 'deploy-context.json' }}
          VERSION_TAG: ${{ inputs.version_tag }}
          SAFE_TX_HASH: ${{ inputs.safe_tx_hash }}
        run: |
          set -euo pipefail
          # Dispatch inputs are operator-typed text. They reach the shell only
          # as environment variables, and only in the shape they must have.
          if ! [[ "$VERSION_TAG" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::version_tag has unexpected characters"; exit 1
          fi
          if ! [[ "$SAFE_TX_HASH" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "::error::safe_tx_hash must be 0x followed by 64 hex characters"; exit 1
          fi
          gh release download "$VERSION_TAG" \
            --pattern "$CONTEXT_ASSET"

      - name: Read deployment context
        id: read
        env:
          CONTEXT_ASSET: ${{ inputs.lane == 'v2' && 'deploy-context-v2.json' || 'deploy-context.json' }}
          LANE: ${{ inputs.lane || 'legacy' }}
        run: |
          cat "$CONTEXT_ASSET"
          # Contexts written before lanes existed have no lane field and are legacy.
          CONTEXT_LANE=$(jq -r '.lane // "legacy"' "$CONTEXT_ASSET")
          if [ "$CONTEXT_LANE" != "$LANE" ]; then
            echo "::error::$CONTEXT_ASSET is for lane '$CONTEXT_LANE', not '$LANE'"
            exit 1
          fi
          for key in compose_hash provision_hash safe_tx_hash phala_app_name base_url api_root_url safe_address app_auth_address version_tag source_sha encrypted_env; do
            val=$(jq -r ".$key" "$CONTEXT_ASSET")
            echo "$key=$val" >> "$GITHUB_OUTPUT"
          done
          # Contexts written since lanes exist record the key list their compose
          # was provisioned with, their lane's replicas, and come from builds
          # that report which replica answers. Older ones have none of these.
          echo "env_keys=$(jq -c '.env_keys // empty' "$CONTEXT_ASSET")" >> "$GITHUB_OUTPUT"
          echo "replicas=$(jq -r '(.replicas // []) | join(" ")' "$CONTEXT_ASSET")" >> "$GITHUB_OUTPUT"
          echo "expected_cvm_name=$(jq -r 'if has("lane") then .phala_app_name else "" end' "$CONTEXT_ASSET")" >> "$GITHUB_OUTPUT"
          # The ingress generation this deployment was proposed with. The gates
          # follow it, not the repo variable, which may have changed since.
          INGRESS=$(jq -r '.ingress // (if .lane == "v2" then "2" else "1" end)' "$CONTEXT_ASSET")
          case "$INGRESS" in 1|2) ;; *) echo "::error::Unknown ingress generation in $CONTEXT_ASSET"; exit 1 ;; esac
          echo "ingress=$INGRESS" >> "$GITHUB_OUTPUT"

      - name: Verify safe_tx_hash matches
        env:
          CONTEXT_HASH: ${{ steps.read.outputs.safe_tx_hash }}
          INPUT_HASH: ${{ inputs.safe_tx_hash }}
        run: |
          if [ "$CONTEXT_HASH" != "$INPUT_HASH" ]; then
            echo "::error::safe_tx_hash mismatch: artifact=$CONTEXT_HASH input=$INPUT_HASH"
            exit 1
          fi
          echo "safe_tx_hash verified: $INPUT_HASH"

  execute-safe-tx:
    needs: [download-context]
    runs-on: self-hosted
    outputs:
      tx_hash: ${{ steps.execute.outputs.tx_hash }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install contract dependencies
        working-directory: lit-api-server/blockchain/lit_node_express
        run: npm ci

      - name: Compile contracts
        working-directory: lit-api-server/blockchain/lit_node_express
        run: npx hardhat compile

      - name: Verify Safe transaction was executed
        id: execute
        working-directory: lit-api-server/blockchain/lit_node_express
        env:
          SAFE_ADDRESS: ${{ needs.download-context.outputs.safe_address }}
          SAFE_TX_HASH: ${{ needs.download-context.outputs.safe_tx_hash }}
        run: |
          set -euo pipefail
          # Values read from the release asset reach the shell only as
          # environment variables, and only in the shape they must have.
          if ! [[ "$SAFE_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]] || ! [[ "$SAFE_TX_HASH" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "::error::The deployment context has a malformed Safe address or transaction hash"; exit 1
          fi
          OUTPUT=$(npx hardhat execute-safe-tx \
            --network base \
            --safe "$SAFE_ADDRESS" \
            --safe-tx-hash "$SAFE_TX_HASH" \
            2>&1 | tee /dev/stderr)
          TX_HASH=$(echo "$OUTPUT" | grep '^TX_HASH=' | cut -d= -f2)
          if [ -z "$TX_HASH" ]; then
            echo "::error::Failed to extract TX_HASH from execute-safe-tx output"
            exit 1
          fi
          echo "tx_hash=$TX_HASH" >> "$GITHUB_OUTPUT"

  verify-compose-hash-onchain:
    needs: [download-context, execute-safe-tx]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install contract dependencies
        working-directory: lit-api-server/blockchain/lit_node_express
        run: npm ci

      - name: Compile contracts
        working-directory: lit-api-server/blockchain/lit_node_express
        run: npx hardhat compile

      - name: Verify compose hash is whitelisted on-chain
        working-directory: lit-api-server/blockchain/lit_node_express
        env:
          APP_AUTH: ${{ needs.download-context.outputs.app_auth_address }}
          COMPOSE_HASH: ${{ needs.download-context.outputs.compose_hash }}
        run: |
          set -euo pipefail
          if ! [[ "$APP_AUTH" =~ ^0x[0-9a-fA-F]{40}$ ]] || ! [[ "$COMPOSE_HASH" =~ ^(0x)?[0-9a-fA-F]{64}$ ]]; then
            echo "::error::The deployment context has a malformed AppAuth address or compose hash"; exit 1
          fi
          npx hardhat verify-compose-hash \
            --network base \
            --app-auth "$APP_AUTH" \
            --compose-hash "$COMPOSE_HASH"

      # The key service reads finalized chain state: a replica started before
      # the Safe transaction is finalized (about 18 minutes on Base) is refused
      # its keys.
      - name: Wait for the approval to be finalized
        env:
          APP_AUTH: ${{ needs.download-context.outputs.app_auth_address }}
          COMPOSE_HASH: ${{ needs.download-context.outputs.compose_hash }}
          BASE_CHAIN_RPC: ${{ secrets.BASE_CHAIN_RPC }}
        run: python3 scripts/compose-hash-final.py "$APP_AUTH" "$COMPOSE_HASH"

  commit-deploy:
    needs: [download-context, verify-compose-hash-onchain]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Phala CLI
        run: npm install -g phala

      - name: Commit deployment to Phala (phase 2)
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          PROVISION_HASH: ${{ needs.download-context.outputs.provision_hash }}
          ENCRYPTED_ENV: ${{ needs.download-context.outputs.encrypted_env }}
          PHALA_APP_NAME: ${{ needs.download-context.outputs.phala_app_name }}
          CONTEXT_ENV_KEYS: ${{ needs.download-context.outputs.env_keys }}
          CONTEXT_HAS_LANE: ${{ needs.download-context.outputs.expected_cvm_name != '' }}
        run: |
          # Commit the provisioned compose file update using the PROVISION hash
          # (not the client-side compose_hash). The provision_hash is the value
          # returned by the Phala provision API and serves as a reference key
          # for the PATCH call. The client-side compose_hash (which matches
          # what the CVM will compute) was used for the Safe proposal.
          #
          # The encrypted_env (hex blob, sealed to the CVM's X25519 key) and
          # env_keys are sent alongside the hash so that the CVM's encrypted
          # environment is updated atomically with the compose file.
          COMMIT_PAYLOAD=$(mktemp)
          trap 'rm -f "$COMMIT_PAYLOAD"' EXIT

          ENV_KEYS='["STRIPE_SECRET_KEY","STRIPE_PUBLISHABLE_KEY","GCP_SERVICE_ACCOUNT_JSON","GCP_PROJECT_ID","BASE_CHAIN_RPC","CERTBOT_DOMAIN","CERTBOT_AWS_ACCESS_KEY_ID","CERTBOT_AWS_SECRET_ACCESS_KEY","CERTBOT_AWS_ROLE_ARN","CERTBOT_AWS_REGION","LIT_INTERNAL_SHARED_SECRET","PHALA_CVM_NAME","NEW_ACCOUNT_RATE_LIMIT_ENABLED","LIT_PAYER_SHARD","LIT_PEER_BASE_URLS","LIT_ORIGIN_SUNSET","LIT_ORIGIN_SUCCESSOR_URL"]'
          # Commit exactly the key list the compose was provisioned with: a
          # different list changes the manifest hash the Safe approved. New
          # contexts record theirs; one proposed before lanes existed was
          # provisioned with the earlier list.
          if [ -n "$CONTEXT_ENV_KEYS" ]; then
            ENV_KEYS="$CONTEXT_ENV_KEYS"
          elif [ "$CONTEXT_HAS_LANE" != "true" ]; then
            ENV_KEYS='["STRIPE_SECRET_KEY","STRIPE_PUBLISHABLE_KEY","GCP_SERVICE_ACCOUNT_JSON","GCP_PROJECT_ID","BASE_CHAIN_RPC","CERTBOT_DOMAIN","CERTBOT_AWS_ACCESS_KEY_ID","CERTBOT_AWS_SECRET_ACCESS_KEY","CERTBOT_AWS_ROLE_ARN","CERTBOT_AWS_REGION","LIT_INTERNAL_SHARED_SECRET","PHALA_CVM_NAME","NEW_ACCOUNT_RATE_LIMIT_ENABLED"]'
          fi

          jq -n \
            --arg hash "$PROVISION_HASH" \
            --arg env "$ENCRYPTED_ENV" \
            --argjson keys "$ENV_KEYS" \
            '{
              compose_hash: $hash,
              encrypted_env: $env,
              env_keys: $keys,
              update_env_vars: true
            }' > "$COMMIT_PAYLOAD"

          phala api "/cvms/$PHALA_APP_NAME/compose_file" \
            -X PATCH \
            --input "$COMMIT_PAYLOAD" \
            --json

      - name: Start updated CVM if stopped
        shell: bash
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          PHALA_APP_NAME: ${{ needs.download-context.outputs.phala_app_name }}
        run: |
          # Updates preserve the VM's power state. Wait for the update to settle
          # before starting a stopped target; leave running instances alone.
          for attempt in {1..60}; do
            STATUS=$(phala cvms get "$PHALA_APP_NAME" --json | jq -er '.status')
            case "$STATUS" in
              stopped)
                phala cvms start "$PHALA_APP_NAME"
                exit 0
                ;;
              running) exit 0 ;;
              starting|stopping|updating|restarting) sleep 5 ;;
              *)
                echo "::error::Unexpected CVM status '$STATUS' for '$PHALA_APP_NAME'"
                exit 1
                ;;
            esac
          done
          echo "::error::Timed out waiting for '$PHALA_APP_NAME' to settle after update"
          exit 1

  wait-for-api-available:
    needs: [commit-deploy, download-context]
    uses: ./.github/workflows/wait-for-api-restart.yml
    with:
      api_root_url: ${{ needs.download-context.outputs.api_root_url }}
      expected_sha: ${{ needs.download-context.outputs.source_sha }}
      # The replica this run deployed must be the one answering: with two
      # replicas up, the old one could otherwise satisfy the version check.
      expected_cvm_name: ${{ needs.download-context.outputs.expected_cvm_name }}
      runner: '["self-hosted"]'

  # The dstack instance this run deployed. On the v2 lane the old and new
  # replicas share a node and both answer the hostname until the old one is
  # retired, so the SDK gate must be told which of them it is checking.
  target-instance:
    needs: [wait-for-api-available, download-context]
    if: ${{ inputs.lane == 'v2' }}
    runs-on: self-hosted
    outputs:
      instance_id: ${{ steps.instance.outputs.instance_id }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Phala CLI
        run: npm install -g phala
      - name: Read the deployed replica's instance id
        id: instance
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          PHALA_APP_NAME: ${{ needs.download-context.outputs.phala_app_name }}
        run: |
          set -euo pipefail
          INSTANCE_ID=$(phala cvms get "$PHALA_APP_NAME" --json | jq -er '.instance_id | select(type == "string" and test("^(0x)?[0-9a-fA-F]+$"))')
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

  verify-attestation:
    needs: [wait-for-api-available, download-context, target-instance]
    # Runs for the legacy lane too, where target-instance is skipped.
    if: ${{ always() && needs.wait-for-api-available.result == 'success' && (needs.target-instance.result == 'success' || (needs.target-instance.result == 'skipped' && inputs.lane != 'v2')) }}
    uses: ./.github/workflows/verify-attestation.yml
    with:
      base_url: ${{ needs.download-context.outputs.base_url }}
      runner: '["self-hosted"]'
      sdk_policy: production
      # Production verifies the public hostname. On the v2 lane that hostname
      # must be AMD, answered by the replica this run deployed, with its TLS
      # bound to the attested VM unless the lane was proposed on ingress 1.x.
      sdk_require_binding: ${{ inputs.lane == 'v2' && needs.download-context.outputs.ingress != '1' }}
      sdk_no_binding: ${{ inputs.lane == 'v2' && needs.download-context.outputs.ingress == '1' }}
      sdk_expect_instance: ${{ needs.target-instance.outputs.instance_id }}
      sdk_expect_platform: ${{ inputs.lane == 'v2' && 'sev-snp' || '' }}
      # The legacy lane is an Intel box whose guest agent predates Attest; its
      # customers verify the TDX quote, so that is what its gate checks.
      evidence: ${{ inputs.lane == 'v2' && 'v3' || (vars.PROD_ATTESTATION_EVIDENCE || 'tdx-quote') }}

  openapi-spec-check:
    needs: [wait-for-api-available, download-context]
    uses: ./.github/workflows/openapi-spec-check.yml
    with:
      api_root_url: ${{ needs.download-context.outputs.api_root_url }}
      runner: '["self-hosted"]'

  k6-smoke:
    needs: [wait-for-api-available, openapi-spec-check, download-context]
    uses: ./.github/workflows/k6-smoke.yml
    with:
      api_root_url: ${{ needs.download-context.outputs.api_root_url }}
      env: prod
    secrets:
      accounts_json: ${{ secrets.K6_ACCOUNTS_PROD_JSON }}

  k6-correctness:
    needs: [wait-for-api-available, k6-smoke, download-context]
    uses: ./.github/workflows/k6-correctness.yml
    with:
      api_root_url: ${{ needs.download-context.outputs.api_root_url }}
      env: prod
    secrets:
      accounts_json: ${{ secrets.K6_ACCOUNTS_PROD_JSON }}

  # Publish the draft GitHub release created by Phase 1 after all verification passes.
  # A lane whose replicas share a Phala node cannot move its hostname by DNS:
  # the node serves the hostname from one instance, and which one is ambiguous
  # while both run. So once the new replica has passed every check, stop the
  # lane's other running replicas. This also leaves the pair with one running
  # and one stopped member, which is how the next release finds its cold
  # replica. The legacy lane's replicas are on different nodes and are retired
  # by hand, as before.
  retire-previous:
    needs: [download-context, k6-correctness, verify-attestation]
    if: ${{ inputs.lane == 'v2' && needs.download-context.outputs.replicas != '' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Phala CLI
        run: npm install -g phala
      - name: Stop the lane's other running replicas
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          NEW: ${{ needs.download-context.outputs.phala_app_name }}
          REPLICAS: ${{ needs.download-context.outputs.replicas }}
          PUBLIC_URL: ${{ needs.download-context.outputs.base_url }}
        run: |
          set -euo pipefail
          for old in $REPLICAS; do
            [ "$old" != "$NEW" ] || continue
            status=$(phala cvms get "$old" --json | jq -er '.status')
            if [ "$status" = "stopped" ]; then
              echo "$old is already stopped"
              continue
            fi
            # Verifies the new replica on its own URL and on the public
            # hostname, stops the old one, then verifies the hostname again.
            python3 scripts/phala-pingpong.py retire "$old" "$NEW" "$PUBLIC_URL"
          done

  # A replica that failed a gate must not keep answering the hostname next to
  # the one customers were already on: both would serve until someone noticed,
  # one of them unverified. Stop the replica this run deployed, after checking
  # that the lane's other running replica is healthy.
  stop-failed-target:
    needs: [download-context, commit-deploy, wait-for-api-available, target-instance, verify-attestation, openapi-spec-check, k6-smoke, k6-correctness]
    if: ${{ always() && inputs.lane == 'v2' && needs.download-context.outputs.replicas != '' && needs.commit-deploy.result == 'success' && contains(needs.*.result, 'failure') }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Phala CLI
        run: npm install -g phala
      - name: Stop the failed replica and keep the previous one serving
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          FAILED: ${{ needs.download-context.outputs.phala_app_name }}
          REPLICAS: ${{ needs.download-context.outputs.replicas }}
          PUBLIC_URL: ${{ needs.download-context.outputs.base_url }}
        run: |
          set -euo pipefail
          for other in $REPLICAS; do
            [ "$other" != "$FAILED" ] || continue
            status=$(phala cvms get "$other" --json | jq -er '.status')
            [ "$status" = "running" ] || continue
            # Verifies the surviving replica on its own URL and on the public
            # hostname, stops the failed one, then verifies the hostname again.
            python3 scripts/phala-pingpong.py retire "$FAILED" "$other" "$PUBLIC_URL"
            echo "::error::$FAILED failed verification and was stopped; $other serves $PUBLIC_URL."
            exit 0
          done
          echo "::error::$FAILED failed verification and no other replica of its lane is running, so it was left serving $PUBLIC_URL. Fix or stop it by hand."
          exit 1

  publish-release:
    if: ${{ always() && needs.download-context.outputs.version_tag != '' && needs.k6-correctness.result == 'success' && needs.verify-attestation.result == 'success' && (needs.retire-previous.result == 'success' || needs.retire-previous.result == 'skipped') }}
    needs: [download-context, k6-correctness, verify-attestation, retire-previous]
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Install GitHub CLI
        run: |
          if command -v gh &> /dev/null; then exit 0; fi
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update && sudo apt-get install -y gh

      - name: Mark this lane deployed and publish once every lane is
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.download-context.outputs.version_tag }}
          LANE: ${{ inputs.lane || 'legacy' }}
          CONTEXT_ASSET: ${{ inputs.lane == 'v2' && 'deploy-context-v2.json' || 'deploy-context.json' }}
          CONTEXT_HAS_LANE: ${{ needs.download-context.outputs.expected_cvm_name != '' }}
        run: |
          set -euo pipefail
          # Read into a variable each time: piping gh into `grep -q` under
          # pipefail fails when grep exits before gh has finished writing.
          has_asset() { local names; names=$(gh release view "$TAG" --json assets --jq '.assets[].name'); grep -Eqx "$1" <<<"$names"; }
          # Phase 1 records every lane the release has (deploy-lanes.json). Each
          # lane leaves a marker here when it has deployed and passed its gates,
          # and the release is published when every recorded lane has one. The
          # marker is written before this lane's context is removed, so a run
          # that stops part-way can be repeated or finished by the other lane.
          if [ "$CONTEXT_HAS_LANE" = "true" ]; then
            if ! has_asset 'deploy-lanes\.json'; then
              echo "::error::Release $TAG has no record of its lanes. Re-run Phase 1; the release stays a draft."
              exit 1
            fi
            echo '{}' > "deployed-$LANE.json"
            gh release upload "$TAG" "deployed-$LANE.json" --clobber
          fi
          # A context holds the encrypted environment: it goes as soon as its
          # lane has deployed, and none may be attached to a published release.
          gh release delete-asset "$TAG" "$CONTEXT_ASSET" --yes || true
          if [ "$CONTEXT_HAS_LANE" = "true" ]; then
            rm -f deploy-lanes.json
            gh release download "$TAG" --pattern deploy-lanes.json
            WAITING=""
            for lane in $(jq -r '.lanes[]' deploy-lanes.json); do
              [[ "$lane" =~ ^[a-z0-9]+$ ]] || { echo "::error::Unexpected lane name in deploy-lanes.json"; exit 1; }
              has_asset "deployed-$lane\.json" || WAITING="$WAITING $lane"
            done
            if [ -n "$WAITING" ]; then
              echo "::notice::Release $TAG stays a draft until these lanes are deployed:$WAITING"
              exit 0
            fi
          fi
          if has_asset 'deploy-context.*'; then
            echo "::error::Release $TAG still has a deployment context attached; not publishing."
            exit 1
          fi
          NAMES=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for name in $(grep -E '^(deploy-lanes|deployed-[a-z0-9]+)\.json$' <<<"$NAMES" || true); do
            gh release delete-asset "$TAG" "$name" --yes
          done
          gh release edit "$TAG" --draft=false
