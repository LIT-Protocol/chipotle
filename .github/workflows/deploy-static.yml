name: Deploy Static Site
on:
  push:
    branches: [main, next]
    paths:
      - 'lit-static/**'
      - 'lit-dashboard-auth/scripts/configure-static.py'
      - '.github/workflows/deploy-static.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which deploy job to run'
        required: true
        default: 'deploy-next'
        type: choice
        options:
          - deploy-next
          - deploy-main

permissions:
  contents: read
  deployments: write

jobs:
  deploy-main:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'deploy-main')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inject API URL
        run: sed -i "s|__LIT_API_BASE_URL__|https://test.chipotle.litprotocol.com|g" lit-static/dapps/dashboard/auth.js

      - name: Inject lit-payments URL
        run: sed -i "s|__LIT_PAYMENTS_BASE_URL__|${{ vars.LIT_PAYMENTS_STAGING_URL }}|g" lit-static/dapps/dashboard/auth.js

      # Empty LIT_AUTH_STAGING_URL keeps password login off on
      # dashboard.dev.litprotocol.com. Set it to the staging lit-payments URL
      # (and add that dashboard to DASHBOARD_AUTH_URLS on Railway) to enable it.
      - name: Configure password auth service
        env:
          AUTH_URL: ${{ vars.LIT_AUTH_STAGING_URL }}
        run: python3 lit-dashboard-auth/scripts/configure-static.py

      - name: Inject dashboard git commit
        run: sed -i "s|__LIT_DASHBOARD_GIT_COMMIT__|${GITHUB_SHA}|g" lit-static/dapps/dashboard/about.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy lit-static --project-name=lit-static-dev --branch=main

  deploy-next:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/next') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'deploy-next')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inject API URL
        run: sed -i "s|__LIT_API_BASE_URL__|https://test.chipotle.litprotocol.com|g" lit-static/dapps/dashboard/auth.js

      - name: Inject lit-payments URL
        run: sed -i "s|__LIT_PAYMENTS_BASE_URL__|${{ vars.LIT_PAYMENTS_STAGING_URL }}|g" lit-static/dapps/dashboard/auth.js

      # Password login is served by the staging lit-payments service (Railway),
      # which must list https://lit-static-next.pages.dev/dapps/dashboard/ in
      # DASHBOARD_AUTH_URLS with DASHBOARD_AUTH_COOKIE_SAMESITE=none (pages.dev
      # and up.railway.app are cross-site). See plans/dashboard-auth-on-lit-payments.md.
      - name: Configure password auth service (staging lit-payments)
        env:
          AUTH_URL: ${{ vars.LIT_PAYMENTS_STAGING_URL }}
        run: python3 lit-dashboard-auth/scripts/configure-static.py

      - name: Inject dashboard git commit
        run: sed -i "s|__LIT_DASHBOARD_GIT_COMMIT__|${GITHUB_SHA}|g" lit-static/dapps/dashboard/about.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy lit-static --project-name=lit-static-next --branch=main
