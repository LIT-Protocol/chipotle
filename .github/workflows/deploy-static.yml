# Deploy main to the next static site, matching Deploy Staging / chipotle-next.
# The next git branch is retired; the legacy dev site is no longer deployed here.
name: Deploy Static Site
on:
  push:
    branches: [main]
    paths:
      - 'lit-static/**'
      - 'lit-dashboard-auth/scripts/configure-static.py'
      - '.github/workflows/deploy-static.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-next:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inject API URL
        run: sed -i "s|__LIT_API_BASE_URL__|https://test.chipotle.litprotocol.com|g" lit-static/dapps/dashboard/auth.js

      - name: Inject lit-payments URL
        run: sed -i "s|__LIT_PAYMENTS_BASE_URL__|${{ vars.LIT_PAYMENTS_STAGING_URL }}|g" lit-static/dapps/dashboard/auth.js

      # Password login is served by the staging lit-payments service
      # (staging.payments.litprotocol.com), which must list
      # https://next.dashboard.chipotle.litprotocol.com/dapps/dashboard/ in
      # DASHBOARD_AUTH_URLS. See plans/dashboard-auth-on-lit-payments.md.
      - name: Configure password auth service (staging lit-payments)
        env:
          AUTH_URL: ${{ vars.LIT_PAYMENTS_STAGING_URL }}
        run: python3 lit-dashboard-auth/scripts/configure-static.py

      - name: Inject dashboard git commit
        run: sed -i "s|__LIT_DASHBOARD_GIT_COMMIT__|${GITHUB_SHA}|g" lit-static/dapps/dashboard/about.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy lit-static --project-name=lit-static-next --branch=main
