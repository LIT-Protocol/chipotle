# Compare the deployed API with a fresh client generated from this checkout.
# Called from Deploy to Phala CVM after wait-for-api-restart, or manually via workflow_dispatch.

name: OpenAPI Spec Check

permissions:
  contents: read

# checkov:skip=CKV_GHA_7:Manual api_root_url/runner selection requires workflow_dispatch inputs
on:
  workflow_call:
    inputs:
      api_root_url:
        description: API base URL (e.g. https://example.com/core/v1)
        required: true
        type: string
      runner:
        description: Runner as JSON array (e.g. ["self-hosted"]), to match caller's runner
        required: false
        type: string
        default: '["self-hosted"]'
  workflow_dispatch:
    inputs:
      api_root_url:
        description: API base URL (e.g. https://example.com/core/v1)
        required: true
        type: string
      runner:
        description: Runner as JSON array
        required: false
        type: string
        default: '["self-hosted"]'

jobs:
  openapi-spec-check:
    runs-on: ${{ fromJson(inputs.runner) }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/generate-k6-client
        with:
          output_directory: ${{ runner.temp }}/k6-source

      - name: Generate client from deployed OpenAPI spec
        env:
          API_ROOT_URL: ${{ inputs.api_root_url }}
        run: bash k6/generate-client.sh "${API_ROOT_URL%/}/openapi.json" "${{ runner.temp }}/k6-deployed"

      - name: Compare deployed API with sources
        run: |
          if ! diff -u "${{ runner.temp }}/k6-source/litApiServer.ts" "${{ runner.temp }}/k6-deployed/litApiServer.ts"; then
            echo "::error::Deployed OpenAPI differs from this checkout's sources. Check the deployed revision and rollout; regenerating the committed client cannot fix this mismatch."
            exit 1
          fi
          echo "Deployed OpenAPI matches sources"
