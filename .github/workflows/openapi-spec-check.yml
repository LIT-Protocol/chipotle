# Run openapi-to-k6 against deployed OpenAPI spec and fail if litApiServer.ts has drifted.
# Called from Deploy to Phala CVM after wait-for-api-restart, or manually via workflow_dispatch.

name: OpenAPI Spec Check

permissions:
  contents: read

# checkov:skip=CKV_GHA_7:Manual api_root_url/runner selection requires workflow_dispatch inputs
on:
  workflow_call:
    inputs:
      api_root_url:
        description: API base URL (e.g. https://example.com/core/v1)
        required: true
        type: string
      runner:
        description: Runner as JSON array (e.g. ["self-hosted"]), to match caller's runner
        required: false
        type: string
        default: '["self-hosted"]'
  workflow_dispatch:
    inputs:
      api_root_url:
        description: API base URL (e.g. https://example.com/core/v1)
        required: true
        type: string
      runner:
        description: Runner as JSON array
        required: false
        type: string
        default: '["self-hosted"]'

jobs:
  openapi-spec-check:
    runs-on: ${{ fromJson(inputs.runner) }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate litApiServer from deployed OpenAPI spec
        run: |
          npm install -g @grafana/openapi-to-k6
          SPEC_URL="${{ inputs.api_root_url }}/openapi.json"

          # Phala's auto-issued TLS cert for the raw *-8000.*.phala.network CVM
          # endpoint is frequently expired/self-signed (it's Phala-managed, not
          # our certbot cert). openapi-to-k6 fetches the spec via Node's fetch,
          # which can't relax TLS per-host, so pre-download the spec ourselves
          # with curl -k for the Phala direct URL only and feed the local file
          # to the generator. A non-phala.network public domain keeps strict TLS.
          # Box integrity is proven separately by verify-attestation, so trust of
          # Phala's transport cert is not the boundary here. (Same rationale as
          # wait-for-api-restart PR #611 and verify-attestation PR #612.)
          #
          # Match on the extracted hostname (strip scheme, path/query, and port),
          # not the whole URL, so a ".phala.network" substring in a path/query
          # can't flip a non-Phala host into -k.
          HOST="${SPEC_URL#*://}"   # strip scheme
          HOST="${HOST%%/*}"        # strip path/query
          HOST="${HOST%%:*}"        # strip port
          INSECURE=""
          case "$HOST" in *.phala.network) INSECURE="-k" ;; esac

          SPEC_FILE="${{ runner.temp }}/openapi.json"
          curl -sf $INSECURE "$SPEC_URL" -o "$SPEC_FILE"
          openapi-to-k6 --verbose "$SPEC_FILE" "${{ runner.temp }}/k6-generated"

      - name: Compare with committed litApiServer.ts
        run: |
          # openapi-to-k6 does not pin its internal prettier, so union-type
          # formatting (e.g. `A | B` vs leading-pipe multiline) drifts between
          # tool installs even at the same tool version. Normalize both sides
          # through a pinned prettier before diffing so only real spec changes
          # fail this check.
          cp ./k6/litApiServer.ts "${{ runner.temp }}/k6-committed.ts"
          npx --yes prettier@3.9.5 --write "${{ runner.temp }}/k6-generated/litApiServer.ts" "${{ runner.temp }}/k6-committed.ts"
          if ! diff -q "${{ runner.temp }}/k6-generated/litApiServer.ts" "${{ runner.temp }}/k6-committed.ts"; then
            echo "::error::Deployed OpenAPI spec differs from committed k6/litApiServer.ts. Regenerate with: openapi-to-k6 <BASE_URL>/openapi.json ./k6"
            diff "${{ runner.temp }}/k6-generated/litApiServer.ts" "${{ runner.temp }}/k6-committed.ts" || true
            exit 1
          fi
          echo "litApiServer.ts matches deployed OpenAPI spec"
