# Generate the client used by CI; the committed copy is for local convenience.
name: k6 Client Check

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6-client-check:
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: k6-client-check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/generate-k6-client

      - uses: grafana/setup-k6-action@v1

      - name: Validate test imports with the generated client
        run: |
          for spec in k6/smoke.spec.ts k6/correctness/*.spec.ts k6/loadtest/*.spec.ts; do
            k6 inspect "$spec" > /dev/null
          done

      - name: Upload generated client
        uses: actions/upload-artifact@v4
        with:
          name: k6-client
          path: k6/litApiServer.ts
          if-no-files-found: error
