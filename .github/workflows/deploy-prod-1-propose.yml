# Propose Compose Hash — Production deployment Phase 1
#
# Triggered by pushing a version tag (v*). Builds Sigstore-signed images, prepares
# the Phala CVM deployment, and proposes the compose hash to the Safe multisig for
# approval. After signers approve, Phase 2 (deploy-prod-2-execute.yml) is triggered
# manually to execute the Safe transaction and finalize the deployment.
#
# This workflow is designed to be auditable by third parties. The compose hash is a
# commitment to the exact container images that will run in the TEE. The Safe multisig
# ensures that at least 2-of-N signers must approve before the hash is whitelisted
# on the AppAuth (DstackApp) contract on Base.
#
# Flow:
#   1. Build + sign images with Sigstore
#   2. Provision compose file update via Phala Cloud API → get compose hash
#   3. Propose addComposeHash(hash) to Safe multisig on Base
#   4. Create draft GitHub release with deployment context for Phase 2
#   5. Create/advance the release-line branch (release/vX.Y) for hotfixes
#
# Lanes: steps 2-4 run once per lane (deploy-prod-lane-propose.yml). A lane is a
# public hostname and the replicas that serve it:
#   legacy - api.chipotle.litprotocol.com. Always on. Context: deploy-context.json
#   v2     - the hostname in PROD_V2_DOMAIN, replicas in PROD_V2_REPLICAS. On
#            when PROD_V2_DOMAIN is set. Context: deploy-context-v2.json
# The hostname is part of the compose file, so each lane has its own compose
# hash and Safe transaction, and Phase 2 runs once per lane. Images are built
# once and shared.
#
# Release-line branches (CPL-358): each tagged prod release lands its commit on a
# minor-version branch release/vX.Y. All patch releases on a line share one branch,
# giving hotfixes to a shipped version a stable home that never moves as main
# advances. See architectureDocs/deployment/vm-code-upgrade.md ("Release-line branches & hotfixes").
#
# Image provenance (DR-1b): Each image is signed with Sigstore (cosign keyless).
# To verify:
#   cosign verify \
#     --certificate-identity-regexp "https://github.com/LIT-Protocol/chipotle/.*" \
#     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
#     <image>@<digest>
#
# Required secrets:
#   DOCKERHUB_TOKEN - Docker Hub PAT
#   PHALA_CLOUD_API_KEY - Phala Cloud API token
#   SAFE_PROPOSER_PRIVATE_KEY - EOA key for proposing Safe transactions (owner or delegate)
#   STRIPE_SECRET_KEY - Stripe API secret key (live)
#   STRIPE_PUBLISHABLE_KEY - Stripe API publishable key (live)
#   GCP_SERVICE_ACCOUNT_JSON - GCP service account key (raw JSON or base64-encoded)
#   BASE_CHAIN_RPC - RPC endpoint for Base blockchain
#   CERTBOT_AWS_ACCESS_KEY_ID - Route 53 IAM access key for DNS-01 challenge
#   CERTBOT_AWS_SECRET_ACCESS_KEY - Route 53 IAM secret key for DNS-01 challenge
#   CERTBOT_AWS_ROLE_ARN      - IAM role ARN for STS assumption
#
# Required vars:
#   DOCKER_IMAGE - Base image path (e.g. docker.io/username/chipotle)
#   DOCKERHUB_USERNAME - Docker Hub username
#   SAFE_ADDRESS_CHIPOTLE_PROD - Safe multisig address on Base
#   APP_AUTH_ADDRESS_CHIPOTLE_PROD - AppAuth (DstackApp) contract address on Base (fallback if CVM auto-detect fails)
#   CERTBOT_AWS_REGION        - AWS region for STS endpoint
#
# Optional vars — second lane and settings for running two lanes at once:
#   PROD_V2_DOMAIN, PROD_V2_REPLICAS (space-separated CVM names) - the v2 lane.
#   PROD_REPLICAS (space-separated CVM names) - the legacy lane's replica pair.
#     Set it to two replicas on the SAME Phala node: Phase 2 then stops the
#     previous replica once the new one has passed its checks, and stops the
#     new one if it fails them, as on the v2 lane. Unset: the original
#     cross-node pair, retired by hand.
#   PROD_PAYER_SHARD / PROD_V2_PAYER_SHARD - each lane's share of the payer pool,
#     "0/2" and "1/2". REQUIRED with two lanes: replicas derive the same payer
#     keys and would otherwise reuse each other's nonces.
#   PROD_PEER_BASE_URLS / PROD_V2_PEER_BASE_URLS - the other lane's origin.
#   PROD_ORIGIN_SUNSET / PROD_ORIGIN_SUCCESSOR_URL - retirement notice served by
#     the legacy lane (HTTP-date, and the v2 origin).
#   PROD_V2_INGRESS - dstack-ingress generation on the v2 lane: "2" (default) or
#     "1" to fall back. The legacy lane stays on 1.
#   PROD_LEGACY_LANE_RETIRED - "true" after the legacy hostname's sunset: only the
#     v2 lane is proposed.

name: "Deploy Prod 1: Propose Compose Hash"

concurrency:
  group: propose-compose-hash
  cancel-in-progress: true

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      phala_cvm_name:
        description: "Target chipotle-prod CVM name or id (e.g. chipotle-prod-rep-xxxxx). Leave blank to auto-select the COLD replica (the prod replica NOT currently serving the public domain). Set this as a break-glass override, or to provision + propose against a freshly-added replica on a new Phala node during a zero-downtime upgrade."
        required: false
        type: string
        default: ""
      lane:
        description: "Lane to propose. phala_cvm_name applies to one lane, so pick it when more than one is enabled."
        required: false
        type: choice
        options: [all, legacy, v2]
        default: all
      skip_staging_check:
        description: "Emergency override: propose even if this commit has no green Deploy Staging run (use only when staging is down for unrelated reasons)."
        required: false
        type: boolean
        default: false

jobs:
  # Refuse to propose a prod release unless the soak perf gate is green for the
  # exact code being shipped. Two parts:
  #   1. Find the most recent first-parent ancestor (mainline) that carries a
  #      perf-gate/soak status — "the last time the soak ran" — and require it
  #      to be success.
  #   2. Require that NO image-affecting path changed between that gated commit
  #      and the release commit. This is what makes "inherit" sound: a version-
  #      bump/no-op release commit inherits the gated result, but a deploy-
  #      relevant change whose soak hasn't run/passed (in-progress, failed before
  #      the soak, or never gated) is caught here instead of silently inheriting
  #      an older success.
  # Overridable on manual dispatch via skip_staging_check (never on a tag push).
  verify-staging-passed:
    runs-on: self-hosted
    permissions:
      contents: read # checkout + read commit statuses
      statuses: read
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.skip_staging_check }}
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # full history for the first-parent walk + diff
      - name: Require the soak gate green for the code being released
        if: ${{ !inputs.skip_staging_check }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          MAX_ANCESTORS: "200"
        run: |
          set -euo pipefail
          # Paths whose contents end up in the prod images / compose. Keep in sync
          # with deploy-staging.yml's DEPLOY_PATHS (minus the staging-only entries:
          # the workflow files and k6/, which don't affect prod image content).
          IMAGE_PATHS=(lit-actions/ lit-api-server/ lit-billing-core/ lit-core/ \
            vendor/hickory-proto/ vendor/ipfs-hasher/ otel-collector/ Dockerfile.lit-actions \
            Dockerfile.lit-api-server Dockerfile.otel-collector docker-compose.phala.yml \
            docker-compose.phala.ingress-v2.yml scripts/phala-compose.py)

          # 1. Most recent first-parent ancestor carrying a perf-gate/soak status.
          gated=""; state=""
          while read -r c; do
            s=$(gh api "repos/${GH_REPO}/commits/${c}/statuses?per_page=100" \
              --jq 'map(select(.context=="perf-gate/soak")) | (first | .state) // "none"')
            if [ "$s" != "none" ]; then gated="$c"; state="$s"; break; fi
          done < <(git rev-list --first-parent -n "${MAX_ANCESTORS}" "${SHA}")

          if [ -z "$gated" ]; then
            echo "::error::No perf-gate/soak status on any of the last ${MAX_ANCESTORS} first-parent ancestors of ${SHA}. Has Deploy Staging run the soak gate on main recently? Override with skip_staging_check=true (manual dispatch) if appropriate."
            exit 1
          fi
          echo "Last soak-gated commit on mainline: ${gated} (perf-gate/soak=${state})"
          if [ "$state" != "success" ]; then
            echo "::error::soak perf gate at ${gated} is '${state}', not 'success'. Fix perf and let Deploy Staging pass before releasing."
            exit 1
          fi

          # 2. No ungated image-affecting change between the gated commit and SHA.
          if ! git diff --quiet "${gated}" "${SHA}" -- "${IMAGE_PATHS[@]}"; then
            echo "::error::Image-affecting changes between the last soak-gated commit ${gated} and the release commit ${SHA} have NOT been soak-gated:"
            git diff --name-only "${gated}" "${SHA}" -- "${IMAGE_PATHS[@]}" | sed 's/^/  /'
            echo "Let Deploy Staging run+pass on the latest deploy-relevant commit before releasing, or override with skip_staging_check=true (manual dispatch)."
            exit 1
          fi
          echo "✓ soak gate passed at ${gated} and no image-affecting change since → release allowed for ${SHA}"
      - name: Staging check skipped (override)
        if: ${{ inputs.skip_staging_check }}
        run: echo "::warning::skip_staging_check=true — proceeding WITHOUT verifying the soak perf gate for ${{ github.sha }}."

  validate-secrets:
    runs-on: self-hosted
    steps:
      - name: Validate required secrets
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BASE_CHAIN_RPC: ${{ secrets.BASE_CHAIN_RPC }}
          CERTBOT_AWS_ACCESS_KEY_ID: ${{ secrets.CERTBOT_AWS_ACCESS_KEY_ID }}
          CERTBOT_AWS_SECRET_ACCESS_KEY: ${{ secrets.CERTBOT_AWS_SECRET_ACCESS_KEY }}
          CERTBOT_AWS_ROLE_ARN: ${{ secrets.CERTBOT_AWS_ROLE_ARN }}
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          SAFE_PROPOSER_PRIVATE_KEY: ${{ secrets.SAFE_PROPOSER_PRIVATE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          LIT_INTERNAL_SHARED_SECRET: ${{ secrets.LIT_INTERNAL_SHARED_SECRET }}
        run: |
          missing=()
          for secret in GCP_SERVICE_ACCOUNT_JSON BASE_CHAIN_RPC CERTBOT_AWS_ACCESS_KEY_ID CERTBOT_AWS_SECRET_ACCESS_KEY CERTBOT_AWS_ROLE_ARN PHALA_CLOUD_API_KEY SAFE_PROPOSER_PRIVATE_KEY STRIPE_SECRET_KEY STRIPE_PUBLISHABLE_KEY LIT_INTERNAL_SHARED_SECRET; do
            if [ -z "${!secret}" ]; then
              missing+=("$secret")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

  build:
    needs: [validate-secrets, verify-staging-passed]
    runs-on: self-hosted
    permissions:
      id-token: write  # required for Sigstore keyless signing (OIDC token)
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: lit-actions
            dockerfile: Dockerfile.lit-actions
          - service: lit-api-server
            dockerfile: Dockerfile.lit-api-server
          - service: otel-collector
            dockerfile: Dockerfile.otel-collector
    steps:
      # Check out by commit SHA, not by tag ref. actions/checkout@v4 does a
      # "ref fixup" fetch that overwrites annotated tag refs with raw commit
      # pointers (git fetch origin +<sha>:refs/tags/<tag>), which causes
      # git describe --always to skip the tag. Checking out by SHA avoids the
      # fixup entirely, keeping annotated tags intact for git_version!().
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKER_IMAGE }}-${{ matrix.service }}:${{ github.sha }}
          build-args: |
            ${{ matrix.service == 'lit-api-server' && 'NODE_CONFIG=NodeConfig.prod.toml' || '' }}

      - name: Sign image with Sigstore (keyless)
        run: |
          cosign sign --yes \
            "${{ vars.DOCKER_IMAGE }}-${{ matrix.service }}@${{ steps.push.outputs.digest }}"

      - name: Save image digest
        run: echo "${{ steps.push.outputs.digest }}" > digest-${{ matrix.service }}.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}
          path: digest-${{ matrix.service }}.txt

  # Which lanes this release proposes.
  plan:
    runs-on: self-hosted
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}
      enabled: ${{ steps.lanes.outputs.enabled }}
    steps:
      - name: Resolve lanes
        id: lanes
        env:
          LANE: ${{ inputs.lane || 'all' }}
          INPUT_CVM: ${{ inputs.phala_cvm_name }}
          PROD_REPLICAS: ${{ vars.PROD_REPLICAS }}
          PROD_PAYER_SHARD: ${{ vars.PROD_PAYER_SHARD }}
          PROD_PEER_BASE_URLS: ${{ vars.PROD_PEER_BASE_URLS }}
          PROD_ORIGIN_SUNSET: ${{ vars.PROD_ORIGIN_SUNSET }}
          PROD_ORIGIN_SUCCESSOR_URL: ${{ vars.PROD_ORIGIN_SUCCESSOR_URL }}
          PROD_V2_DOMAIN: ${{ vars.PROD_V2_DOMAIN }}
          PROD_V2_REPLICAS: ${{ vars.PROD_V2_REPLICAS }}
          PROD_V2_PAYER_SHARD: ${{ vars.PROD_V2_PAYER_SHARD }}
          PROD_V2_PEER_BASE_URLS: ${{ vars.PROD_V2_PEER_BASE_URLS }}
          PROD_LEGACY_LANE_RETIRED: ${{ vars.PROD_LEGACY_LANE_RETIRED }}
          PROD_V2_INGRESS: ${{ vars.PROD_V2_INGRESS }}
        run: |
          set -euo pipefail
          # The legacy lane's replica set: PROD_REPLICAS, or the original pair.
          LEGACY_REPLICAS="${PROD_REPLICAS:-chipotle-prod-rep-r68r6 chipotle-prod-rep-08tv3}"
          if [ -n "$PROD_REPLICAS" ] && [ "$(wc -w <<< "$PROD_REPLICAS")" -ne 2 ]; then
            echo "::error::PROD_REPLICAS must name exactly two replicas on one Phala node."
            exit 1
          fi
          LEGACY_DOMAIN="api.chipotle.litprotocol.com"

          LANES=$(jq -cn \
            --arg domain "$LEGACY_DOMAIN" --arg replicas "$LEGACY_REPLICAS" \
            --arg shard "$PROD_PAYER_SHARD" --arg peers "$PROD_PEER_BASE_URLS" \
            --arg sunset "$PROD_ORIGIN_SUNSET" --arg successor "$PROD_ORIGIN_SUCCESSOR_URL" \
            '[{name: "legacy", domain: $domain, replicas: $replicas, context_asset: "deploy-context.json", ingress: "1",
               payer_shard: $shard, peer_base_urls: $peers, origin_sunset: $sunset, origin_successor_url: $successor}]')
          # DNS names are case-insensitive: "API.chipotle..." is the legacy
          # hostname, and an AMD ingress told to claim it would take it over.
          PROD_V2_DOMAIN=$(printf '%s' "$PROD_V2_DOMAIN" | tr '[:upper:]' '[:lower:]')
          PROD_V2_DOMAIN="${PROD_V2_DOMAIN%.}"
          if [ -n "$PROD_V2_DOMAIN" ]; then
            if ! [[ "$PROD_V2_DOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]]; then
              echo "::error::PROD_V2_DOMAIN must be a hostname, with no scheme, path or port."
              exit 1
            fi
            if [ -z "$PROD_V2_REPLICAS" ] || [ "$PROD_V2_DOMAIN" = "$LEGACY_DOMAIN" ]; then
              echo "::error::The v2 lane needs PROD_V2_REPLICAS and a PROD_V2_DOMAIN different from $LEGACY_DOMAIN."
              exit 1
            fi
            # Replicas of both lanes derive the same payer keys. Without disjoint
            # shares they reuse each other's nonces and user writes fail at random.
            # Compared as numbers, the way the server reads them: "00/2" is shard 0.
            canonical_shard() {
              [[ "$1" =~ ^([0-9]+)/([0-9]+)$ ]] || return 1
              local index=$((10#${BASH_REMATCH[1]})) count=$((10#${BASH_REMATCH[2]}))
              [ "$index" -lt "$count" ] && [ "$count" -le 16 ] || return 1
              printf '%s/%s\n' "$index" "$count"
            }
            if [ "$PROD_LEGACY_LANE_RETIRED" = "true" ]; then
              :
            elif ! LEGACY_SHARD=$(canonical_shard "$PROD_PAYER_SHARD") \
              || ! V2_SHARD=$(canonical_shard "$PROD_V2_PAYER_SHARD") \
              || [ "$LEGACY_SHARD" = "$V2_SHARD" ] \
              || [ "${LEGACY_SHARD#*/}" != "${V2_SHARD#*/}" ]; then
              echo "::error::Two lanes need distinct payer shards of the same count: set PROD_PAYER_SHARD and PROD_V2_PAYER_SHARD (for example 0/2 and 1/2)."
              exit 1
            fi
            for replica in $PROD_V2_REPLICAS; do
              case " $LEGACY_REPLICAS " in *" $replica "*)
                echo "::error::Replica $replica cannot belong to both lanes."; exit 1 ;;
              esac
            done
            # After the legacy hostname's sunset its lane is dropped and v2 is
            # the only one, so the two-lane requirements no longer apply.
            if [ "$PROD_LEGACY_LANE_RETIRED" = "true" ]; then LANES='[]'; fi
            # v2 first: the new hostname is the canary for a release.
            case "${PROD_V2_INGRESS:-2}" in
              1|2) ;;
              *) echo "::error::PROD_V2_INGRESS must be 1 or 2."; exit 1 ;;
            esac
            LANES=$(jq -cn --argjson legacy "$LANES" --arg ingress "${PROD_V2_INGRESS:-2}" \
              --arg domain "$PROD_V2_DOMAIN" --arg replicas "$PROD_V2_REPLICAS" \
              --arg shard "$PROD_V2_PAYER_SHARD" --arg peers "$PROD_V2_PEER_BASE_URLS" \
              '[{name: "v2", domain: $domain, replicas: $replicas, context_asset: "deploy-context-v2.json", ingress: $ingress,
                 payer_shard: $shard, peer_base_urls: $peers, origin_sunset: "", origin_successor_url: ""}] + $legacy')
          fi
          if [ "$PROD_LEGACY_LANE_RETIRED" = "true" ] && [ -z "$PROD_V2_DOMAIN" ]; then
            echo "::error::PROD_LEGACY_LANE_RETIRED needs the v2 lane (set PROD_V2_DOMAIN)."
            exit 1
          fi
          # Every lane this release has, whichever of them this run proposes.
          echo "enabled=$(jq -cn --argjson lanes "$LANES" '$lanes | map(.name)')" >> "$GITHUB_OUTPUT"
          if [ "$LANE" != "all" ]; then
            LANES=$(jq -cn --argjson lanes "$LANES" --arg lane "$LANE" '$lanes | map(select(.name == $lane))')
          fi
          COUNT=$(jq -n --argjson lanes "$LANES" '$lanes | length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Lane '$LANE' is not enabled (set PROD_V2_DOMAIN)."
            exit 1
          fi
          if [ -n "$INPUT_CVM" ] && [ "$COUNT" -ne 1 ]; then
            echo "::error::phala_cvm_name applies to one lane: choose it with the lane input."
            exit 1
          fi
          echo "Lanes: $LANES"
          echo "lanes=$LANES" >> "$GITHUB_OUTPUT"

  # One lane at a time: they share the draft release, and a release that cannot
  # be proposed on the first lane is not proposed on the next.
  lane:
    needs: [build, plan]
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        lane: ${{ fromJson(needs.plan.outputs.lanes) }}
    uses: ./.github/workflows/deploy-prod-lane-propose.yml
    with:
      lane: ${{ matrix.lane.name }}
      domain: ${{ matrix.lane.domain }}
      replicas: ${{ matrix.lane.replicas }}
      context_asset: ${{ matrix.lane.context_asset }}
      input_cvm: ${{ inputs.phala_cvm_name }}
      ingress: ${{ matrix.lane.ingress }}
      payer_shard: ${{ matrix.lane.payer_shard }}
      peer_base_urls: ${{ matrix.lane.peer_base_urls }}
      origin_sunset: ${{ matrix.lane.origin_sunset }}
      origin_successor_url: ${{ matrix.lane.origin_successor_url }}
    secrets: inherit
    permissions:
      contents: write


  # Record every lane this release has. Phase 2 marks each lane as it deploys
  # and publishes the release only when every lane in this record is marked,
  # so a release whose second proposal failed cannot be published by deploying
  # the first. Written whenever a draft exists, including when a proposal
  # failed and when one lane is proposed again on its own, so that retry can
  # still finish the release.
  record-lanes:
    needs: [plan, lane]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Attach the lane record to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ENABLED: ${{ needs.plan.outputs.enabled }}
        run: |
          set -euo pipefail
          if ! DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            echo "::notice::No release $TAG yet (no lane was proposed); nothing to record."
            exit 0
          fi
          if [ "$DRAFT" != "true" ]; then
            echo "::error::Release $TAG is not a draft; refusing to modify it."
            exit 1
          fi
          jq -n --argjson lanes "$ENABLED" '{lanes: $lanes}' > deploy-lanes.json
          gh release upload "$TAG" deploy-lanes.json --clobber

  # Land the released commit on a minor-version release-line branch (release/vX.Y)
  # so hotfixes to a shipped version have a stable home that never moves as main
  # advances (CPL-358). All patch releases on a line (v1.2.0, v1.2.1, ...) share
  # one branch. Runs only for tag pushes; workflow_dispatch re-provisions an
  # existing release and has no tag to key a line off.
  create-release-branch:
    needs: [lane]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: self-hosted
    permissions:
      contents: write # push the release-line branch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # need history to test fast-forward against an existing branch

      - name: Create or advance the release-line branch
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Derive release/vMAJOR.MINOR from the tag. Prefix-match tolerates
          # pre-release suffixes (v1.2.0-rc1 → release/v1.2), keeping the whole
          # 1.2 line on one branch.
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "::notice::Tag '$TAG' is not vMAJOR.MINOR.PATCH — skipping release-branch creation."
            exit 0
          fi
          BRANCH="release/v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          echo "Release-line branch: $BRANCH (tag $TAG @ $SHA)"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # Branch exists — an earlier patch release on this line, or a branch
            # already carrying hotfix commits. Only fast-forward it to the tagged
            # commit; never force-push, which would discard those hotfix commits.
            # Compare against FETCH_HEAD: `git fetch` always writes it, whereas the
            # origin/$BRANCH remote-tracking ref may not exist under checkout's
            # narrow fetch refspec.
            git fetch origin "$BRANCH"
            if git merge-base --is-ancestor FETCH_HEAD "$SHA"; then
              echo "Fast-forwarding $BRANCH to $SHA"
              if ! git push origin "$SHA:refs/heads/$BRANCH"; then
                echo "::warning::Failed to push $BRANCH to $SHA (branch may have moved). Leaving it untouched."
              fi
            else
              echo "::warning::$BRANCH has diverged from $SHA (likely carries hotfix commits). Leaving it untouched — reconcile manually if this release should advance the line."
            fi
          else
            echo "Creating $BRANCH at $SHA"
            if ! git push origin "$SHA:refs/heads/$BRANCH"; then
              echo "::warning::Failed to create $BRANCH at $SHA."
            fi
          fi
