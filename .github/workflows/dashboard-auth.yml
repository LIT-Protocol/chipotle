name: Dashboard password authentication
on:
  pull_request:
    paths:
      - 'lit-dashboard-auth/**'
      - 'lit-static/dapps/dashboard/**'
      - 'e2e/password/**'
      - 'e2e/playwright.password.config.ts'
      - '.github/workflows/dashboard-auth.yml'
  push:
    branches: [main]
    paths:
      - 'lit-dashboard-auth/**'
      - 'lit-static/dapps/dashboard/**'
      - 'e2e/password/**'
      - 'e2e/playwright.password.config.ts'
      - '.github/workflows/dashboard-auth.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy auth Worker (frontend enabled separately with LIT_AUTH_*_URL)'
        type: choice
        required: true
        options: [staging, production]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
        working-directory: lit-dashboard-auth
      - run: pnpm check && pnpm test
        working-directory: lit-dashboard-auth
      - name: Verify committed crypto bundle
        run: git diff --exit-code -- lit-static/dapps/dashboard/password-crypto-worker.js
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - run: pnpm exec playwright test --config playwright.password.config.ts
        working-directory: e2e
        env:
          AGENT_SCREENSHOTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-auth-browser-results
          path: e2e/test-results/
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: dashboard-auth-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
        working-directory: lit-dashboard-auth
      - run: pnpm run deploy
        working-directory: lit-dashboard-auth
        env:
          AUTH_ENVIRONMENT: ${{ inputs.environment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_DATABASE_ID: ${{ vars.AUTH_DATABASE_ID }}
          AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
          AUTH_DASHBOARD_URL: ${{ vars.AUTH_DASHBOARD_URL }}
          AUTH_MAIL_FROM: ${{ vars.AUTH_MAIL_FROM }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
