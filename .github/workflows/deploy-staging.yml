# Deploy lit-api-server + lit-actions + otel-collector to Phala CVM
#
# Deployment target:
#   push to main → chipotle-next (zero-downtime ping-pong cutover; test.chipotle.litprotocol.com)
#   The `next` git branch is retired and chipotle-dev is deprecated — main is the deploy branch now.
#
# Lanes: a lane is one public hostname and the instance pair that serves it; its
# deploy, verification, cutover and rollback live in deploy-staging-lane.yml.
# Images are built once here and every enabled lane deploys them, one lane at a
# time, so a bad build stops at the first lane.
#   legacy - test.chipotle.litprotocol.com, instances NEXT_CVM_A / NEXT_CVM_B. Always on.
#   v2     - the hostname in NEXT_V2_DOMAIN, instances NEXT_V2_CVM_A / NEXT_V2_CVM_B.
#            On when NEXT_V2_DOMAIN is set. Deploys first.
# Both lanes are instances of the same app (one app_id, same derived keys).
# The per-lane vars are below.
#
# For production (v* tag) deploys, see deploy-prod-1-propose.yml and deploy-prod-2-execute.yml.
#
# Image provenance (DR-1b): Each image is signed with Sigstore (cosign keyless) immediately
# after push. Signatures are recorded in the public Rekor transparency log, binding the image
# digest to the GitHub Actions OIDC identity that built it. This allows anyone to verify that
# a given image digest was built from a specific commit in this repository.
#
# To verify an image:
#   cosign verify \
#     --certificate-identity-regexp "https://github.com/LIT-Protocol/chipotle/.*" \
#     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
#     <image>@<digest>
#
# Required GitHub secrets:
#   DOCKERHUB_TOKEN - Docker Hub PAT (Account Settings > Security > Access Tokens)
#   PHALA_CLOUD_API_KEY - From Phala Cloud Dashboard > API Tokens
#   PHALA_DSTACKAPP_PRIVATE_KEY - Private key for DstackApp on-chain KMS
#   STRIPE_SANDBOX_SECRET_KEY - Stripe sandbox/test secret key
#   STRIPE_SANDBOX_PUBLISHABLE_KEY - Stripe sandbox/test publishable key
#   GCP_SERVICE_ACCOUNT_JSON - GCP service account key (raw JSON or base64-encoded)
#   BASE_CHAIN_RPC - RPC endpoint for Base blockchain
#   CERTBOT_AWS_ACCESS_KEY_ID - Route 53 IAM access key for DNS-01 challenge
#   CERTBOT_AWS_SECRET_ACCESS_KEY - Route 53 IAM secret key for DNS-01 challenge
#   CERTBOT_AWS_ROLE_ARN - IAM role ARN for STS assumption (required by dstack-ingress)
#
# Required GitHub vars:
#   DOCKER_IMAGE - Base image path, e.g. docker.io/username/chipotle
#                  Three images are pushed:
#                    ${DOCKER_IMAGE}-lit-actions
#                    ${DOCKER_IMAGE}-lit-api-server
#                    ${DOCKER_IMAGE}-otel-collector
#   DOCKERHUB_USERNAME - Docker Hub username
#
# Optional GitHub vars — enable zero-downtime ping-pong (else legacy single-CVM in-place deploy):
#   NEXT_CVM_A / NEXT_CVM_B - two instance names sharing one app_id, on any nodes.
#   Exactly one must be running and publicly serving its own cvm_name; the other
#   must be stopped. All bootstrap images must expose /core/v1/version.cvm_name.
#   Both instances' Phala devices MUST be allowlisted on the app's AppAuth contract
#   (`phala cvms device-allowlist`) so the shared app_id derives keys on either node.
#
# Optional GitHub vars — second lane and settings for running two lanes at once:
#   NEXT_V2_DOMAIN, NEXT_V2_CVM_A, NEXT_V2_CVM_B - enable and define the v2 lane.
#   NEXT_PAYER_SHARD / NEXT_V2_PAYER_SHARD - each lane's share of the payer pool,
#     "0/2" and "1/2". REQUIRED once both lanes serve traffic: instances derive the
#     same payer keys and would otherwise reuse each other's nonces.
#   NEXT_PEER_BASE_URLS / NEXT_V2_PEER_BASE_URLS - the other lane's origin, so a
#     top-up on one lane clears the cached balance on the other.
#   NEXT_ORIGIN_SUNSET / NEXT_ORIGIN_SUCCESSOR_URL - retirement notice served by
#     the legacy lane (HTTP-date, and the v2 origin).
#   NEXT_V2_INGRESS - dstack-ingress generation on the v2 lane: "2" (default; it
#     publishes the TLS evidence clients bind to on AMD) or "1" to fall back.
#     The legacy lane stays on 1.
#   NEXT_LEGACY_LANE_RETIRED - "true" after the legacy hostname's sunset: only
#     the v2 lane deploys.
#   NEXT_ATTESTATION_EVIDENCE - "tdx-quote" when the legacy lane runs on an Intel
#     box whose guest agent has no Attest RPC; default "v3". The v2 lane is always v3.
#
# Required Phala CVM encrypted env vars (per instance, set via Phala Cloud Dashboard):
#   BASE_CHAIN_RPC             - RPC endpoint for the chain
#   GCP_SERVICE_ACCOUNT_JSON   - GCP service account key (raw JSON or base64-encoded)
#   GCP_PROJECT_ID             - GCP project ID (e.g. "my-gcp-project")
#   STRIPE_SECRET_KEY          - Stripe API secret key (test sandbox for staging, live for prod)
#   STRIPE_PUBLISHABLE_KEY     - Stripe API publishable key (test sandbox for staging, live for prod)
#   CERTBOT_AWS_ACCESS_KEY_ID - Route 53 IAM access key for DNS-01 challenge
#   CERTBOT_AWS_ROLE_ARN      - IAM role ARN for STS assumption (required by dstack-ingress)
#   CERTBOT_AWS_REGION        - AWS region for STS endpoint (e.g. "us-east-1")

name: "Deploy Staging"

# Serialize all deployments to next, including manual runs from other branches. cancel-in-progress is FALSE on purpose: a cutover
# is multi-step (deploy → verify → claim → stop old) and cancelling it midway can
# leave the old instance running / un-stopped. Let an in-flight deploy finish; a
# newer push queues behind it.
concurrency:
  group: ${{ github.event_name == 'push' && vars.NEXT_DEPLOY_PAUSED == 'true' && format('deploy-phala-next-paused-{0}', github.run_id) || 'deploy-phala-next' }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_replica:
        description: "One-time identity bootstrap: require an explicit stopped replica; verify it directly without automatic retirement; failed bootstrap recovers the reference. Reconcile public routing and the pair manually afterward."
        required: false
        type: boolean
        default: false
      phala_cvm_name:
        description: "Target Phala CVM name or id to deploy to (e.g. chipotle-next-rep-xxxxx). Leave blank to use the branch default. Use this to deploy onto a freshly-provisioned replica on a new Phala node during a zero-downtime migration."
        required: false
        type: string
        default: ""
      lane:
        description: "Lane to deploy. bootstrap_replica and phala_cvm_name apply to one lane, so pick it when more than one is enabled."
        required: false
        type: choice
        options: [all, legacy, v2]
        default: all

jobs:
  validate-secrets:
    if: github.event_name != 'push' || vars.NEXT_DEPLOY_PAUSED != 'true'
    runs-on: self-hosted
    steps:
      - name: Validate required secrets
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BASE_CHAIN_RPC: ${{ secrets.BASE_CHAIN_RPC }}
          CERTBOT_AWS_ACCESS_KEY_ID: ${{ secrets.CERTBOT_AWS_ACCESS_KEY_ID }}
          CERTBOT_AWS_SECRET_ACCESS_KEY: ${{ secrets.CERTBOT_AWS_SECRET_ACCESS_KEY }}
          CERTBOT_AWS_ROLE_ARN: ${{ secrets.CERTBOT_AWS_ROLE_ARN }}
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          PHALA_DSTACKAPP_PRIVATE_KEY: ${{ secrets.PHALA_DSTACKAPP_PRIVATE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_SANDBOX_PUBLISHABLE_KEY }}
        run: |
          missing=()
          for secret in GCP_SERVICE_ACCOUNT_JSON BASE_CHAIN_RPC CERTBOT_AWS_ACCESS_KEY_ID CERTBOT_AWS_SECRET_ACCESS_KEY CERTBOT_AWS_ROLE_ARN PHALA_CLOUD_API_KEY PHALA_DSTACKAPP_PRIVATE_KEY STRIPE_SECRET_KEY STRIPE_PUBLISHABLE_KEY; do
            if [ -z "${!secret}" ]; then
              missing+=("$secret")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

  # Which lanes this run deploys, and whether anything deploy-relevant changed.
  plan:
    if: github.event_name != 'push' || vars.NEXT_DEPLOY_PAUSED != 'true'
    runs-on: self-hosted
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}
      soak: ${{ steps.lanes.outputs.soak }}
      deploy_needed: ${{ steps.check.outputs.deploy_needed }}
      node_config: NodeConfig.next.toml
      gcp_project_id: chipotle-next
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve lanes
        id: lanes
        env:
          LANE: ${{ inputs.lane || 'all' }}
          INPUT_CVM: ${{ inputs.phala_cvm_name }}
          BOOTSTRAP: ${{ inputs.bootstrap_replica }}
          NEXT_CVM_A: ${{ vars.NEXT_CVM_A }}
          NEXT_CVM_B: ${{ vars.NEXT_CVM_B }}
          NEXT_PAYER_SHARD: ${{ vars.NEXT_PAYER_SHARD }}
          NEXT_PEER_BASE_URLS: ${{ vars.NEXT_PEER_BASE_URLS }}
          NEXT_ORIGIN_SUNSET: ${{ vars.NEXT_ORIGIN_SUNSET }}
          NEXT_ORIGIN_SUCCESSOR_URL: ${{ vars.NEXT_ORIGIN_SUCCESSOR_URL }}
          NEXT_ATTESTATION_EVIDENCE: ${{ vars.NEXT_ATTESTATION_EVIDENCE }}
          NEXT_LEGACY_LANE_RETIRED: ${{ vars.NEXT_LEGACY_LANE_RETIRED }}
          NEXT_V2_INGRESS: ${{ vars.NEXT_V2_INGRESS }}
          NEXT_V2_DOMAIN: ${{ vars.NEXT_V2_DOMAIN }}
          NEXT_V2_CVM_A: ${{ vars.NEXT_V2_CVM_A }}
          NEXT_V2_CVM_B: ${{ vars.NEXT_V2_CVM_B }}
          NEXT_V2_PAYER_SHARD: ${{ vars.NEXT_V2_PAYER_SHARD }}
          NEXT_V2_PEER_BASE_URLS: ${{ vars.NEXT_V2_PEER_BASE_URLS }}
        run: |
          set -euo pipefail
          # Auto-deploys only fire on push to main. workflow_dispatch from any
          # branch is permitted (and goes to the same staging instances) so
          # feature branches can be tested against staging before merging.
          if [ "${{ github.ref }}" != "refs/heads/main" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Unsupported ref '${{ github.ref }}' — deploy from main (or manual dispatch)."
            exit 1
          fi
          python3 scripts/staging-lanes.py >> "$GITHUB_OUTPUT"

      - name: Check if deploy-relevant paths changed
        id: check
        env:
          LANES: ${{ steps.lanes.outputs.lanes }}
        run: |
          # For workflow_dispatch (manual trigger), always deploy
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — deploying unconditionally"
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check for changes in deploy-relevant paths
          DEPLOY_PATHS=(
            lit-actions/
            lit-api-server/
            lit-billing-core/
            lit-core/
            vendor/ipfs-hasher/
            vendor/hickory-proto/
            otel-collector/
            Dockerfile.lit-actions
            Dockerfile.lit-api-server
            Dockerfile.otel-collector
            docker-compose.phala.yml
            scripts/phala-pingpong.py
            scripts/staging-lanes.py
            scripts/phala-compose.py
            docker-compose.phala.ingress-v2.yml
            .github/workflows/wait-for-api-restart.yml
            .github/workflows/deploy-staging.yml
            .github/workflows/deploy-staging-lane.yml
            .github/workflows/k6-loadtest.yml
            k6/loadtest/
            k6/setup.ts
          )

          # Lanes run the same images, so one lane behind is reason to deploy
          # all of them: every enabled lane must already serve a commit with no
          # deploy-relevant change since.
          NEEDED=false
          for domain in $(printf '%s' "$LANES" | jq -r '.[].domain'); do
            COMMIT_VERSION=$(curl -sf "https://${domain}/core/v1/version" 2>/dev/null | jq -r '.commit_version // empty' 2>/dev/null || true)
            if [ -z "$COMMIT_VERSION" ]; then
              echo "Could not reach /version on ${domain} — deploying"
              NEEDED=true; break
            fi
            echo "${domain} serves commit_version: $COMMIT_VERSION"

            # Parse SHA from git describe --always output:
            #   bare SHA: "abc1234" → "abc1234"
            #   describe: "v0.3.14-5-gabc1234" → "abc1234"
            if echo "$COMMIT_VERSION" | grep -qE -- '-g[0-9a-f]+$'; then
              DEPLOYED_SHA=$(echo "$COMMIT_VERSION" | sed 's/.*-g//')
            else
              DEPLOYED_SHA="$COMMIT_VERSION"
            fi

            if ! git rev-parse --verify "$DEPLOYED_SHA^{commit}" >/dev/null 2>&1; then
              echo "Deployed SHA '$DEPLOYED_SHA' not found in repo history — deploying"
              NEEDED=true; break
            fi

            CHANGED=$(git diff --name-only "$DEPLOYED_SHA" HEAD -- "${DEPLOY_PATHS[@]}")
            if [ -n "$CHANGED" ]; then
              echo "Deploy-relevant changes since ${domain}'s $DEPLOYED_SHA:"
              echo "$CHANGED"
              NEEDED=true; break
            fi
          done
          if [ "$NEEDED" = "false" ]; then
            echo "No deploy-relevant changes on any lane — skipping build & deploy"
          fi
          echo "deploy_needed=${NEEDED}" >> "$GITHUB_OUTPUT"

  build:
    needs: [validate-secrets, plan]
    if: needs.plan.outputs.deploy_needed == 'true'
    runs-on: self-hosted
    permissions:
      id-token: write  # required for Sigstore keyless signing (OIDC token)
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: lit-actions
            dockerfile: Dockerfile.lit-actions
          - service: lit-api-server
            dockerfile: Dockerfile.lit-api-server
          - service: otel-collector
            dockerfile: Dockerfile.otel-collector
    steps:
      # Check out by commit SHA, not by tag ref. actions/checkout@v4 does a
      # "ref fixup" fetch that overwrites annotated tag refs with raw commit
      # pointers (git fetch origin +<sha>:refs/tags/<tag>), which causes
      # git describe --always to skip the tag. Checking out by SHA avoids the
      # fixup entirely, keeping annotated tags intact for git_version!().
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKER_IMAGE }}-${{ matrix.service }}:${{ github.sha }}
          build-args: |
            ${{ matrix.service == 'lit-api-server' && format('NODE_CONFIG={0}', needs.plan.outputs.node_config) || '' }}

      - name: Sign image with Sigstore (keyless)
        run: |
          cosign sign --yes \
            "${{ vars.DOCKER_IMAGE }}-${{ matrix.service }}@${{ steps.push.outputs.digest }}"

      - name: Save image digest
        run: echo "${{ steps.push.outputs.digest }}" > digest-${{ matrix.service }}.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}
          path: digest-${{ matrix.service }}.txt

  # One lane at a time, in the order the plan lists them (v2 first when it is
  # enabled), and stop at the first failure: a build that fails on one lane is
  # not rolled onto the next.
  lane:
    needs: [plan, build]
    if: needs.plan.outputs.deploy_needed == 'true'
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        lane: ${{ fromJson(needs.plan.outputs.lanes) }}
    uses: ./.github/workflows/deploy-staging-lane.yml
    with:
      lane: ${{ matrix.lane.name }}
      domain: ${{ matrix.lane.domain }}
      cvm_a: ${{ matrix.lane.cvm_a }}
      cvm_b: ${{ matrix.lane.cvm_b }}
      default_cvm: ${{ matrix.lane.default_cvm }}
      input_cvm: ${{ matrix.lane.input_cvm }}
      bootstrap: ${{ matrix.lane.bootstrap }}
      gcp_project_id: ${{ needs.plan.outputs.gcp_project_id }}
      payer_shard: ${{ matrix.lane.payer_shard }}
      peer_base_urls: ${{ matrix.lane.peer_base_urls }}
      origin_sunset: ${{ matrix.lane.origin_sunset }}
      origin_successor_url: ${{ matrix.lane.origin_successor_url }}
      soak: ${{ matrix.lane.soak }}
      attestation_evidence: ${{ matrix.lane.attestation_evidence }}
      ingress: ${{ matrix.lane.ingress }}
      expect_platform: ${{ matrix.lane.expect_platform }}
    secrets: inherit

  # Record the soak gate result as a commit status on this SHA, so a prod release
  # can require that the soak JOB actually ran green on the exact commit being
  # released (not just that the overall Deploy Staging run concluded success,
  # which is also true when the gate was SKIPPED for a no-deploy-relevant change).
  # The soak runs inside one lane, and a lane succeeds only if every stage it
  # ran did, so this is the result of all lanes. Skipped when no lane ran
  # (deploy_needed=false) → no status posted → release-time precheck fails
  # closed. See deploy-prod-1-propose.yml.
  mark-perf-gate:
    needs: [plan, lane]
    # Only stamp the trusted status from a main deploy (push or dispatch on main);
    # a workflow_dispatch run on a feature branch must not be able to forge
    # perf-gate/soak on its SHA. Skipped (no status) when no lane ran, or when
    # the run had no soak in it (a bootstrap).
    if: ${{ always() && needs.lane.result != 'skipped' && needs.plan.outputs.soak == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: self-hosted
    permissions:
      statuses: write
    steps:
      - name: Post perf-gate/soak commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RESULT: ${{ needs.lane.result }}
        run: |
          state=$([ "$RESULT" = "success" ] && echo success || echo failure)
          echo "soak gate result=$RESULT → posting perf-gate/soak=$state on $SHA"
          gh api -X POST "repos/${GH_REPO}/statuses/${SHA}" \
            -f state="$state" \
            -f context="perf-gate/soak" \
            -f description="k6 soak perf gate: $RESULT" \
            -f target_url="https://github.com/${GH_REPO}/actions/runs/${{ github.run_id }}"
