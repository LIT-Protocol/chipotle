# Deploy lit-api-server + lit-actions + otel-collector to Phala CVM
#
# Deployment target:
#   push to main → chipotle-next (zero-downtime ping-pong cutover; test.chipotle.litprotocol.com)
#   The `next` git branch is retired and chipotle-dev is deprecated — main is the deploy branch now.
#
# For production (v* tag) deploys, see deploy-prod-1-propose.yml and deploy-prod-2-execute.yml.
#
# Image provenance (DR-1b): Each image is signed with Sigstore (cosign keyless) immediately
# after push. Signatures are recorded in the public Rekor transparency log, binding the image
# digest to the GitHub Actions OIDC identity that built it. This allows anyone to verify that
# a given image digest was built from a specific commit in this repository.
#
# To verify an image:
#   cosign verify \
#     --certificate-identity-regexp "https://github.com/LIT-Protocol/chipotle/.*" \
#     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
#     <image>@<digest>
#
# Required GitHub secrets:
#   DOCKERHUB_TOKEN - Docker Hub PAT (Account Settings > Security > Access Tokens)
#   PHALA_CLOUD_API_KEY - From Phala Cloud Dashboard > API Tokens
#   PHALA_DSTACKAPP_PRIVATE_KEY - Private key for DstackApp on-chain KMS
#   STRIPE_SANDBOX_SECRET_KEY - Stripe sandbox/test secret key
#   STRIPE_SANDBOX_PUBLISHABLE_KEY - Stripe sandbox/test publishable key
#   GCP_SERVICE_ACCOUNT_JSON - GCP service account key (raw JSON or base64-encoded)
#   BASE_CHAIN_RPC - RPC endpoint for Base blockchain
#   CERTBOT_AWS_ACCESS_KEY_ID - Route 53 IAM access key for DNS-01 challenge
#   CERTBOT_AWS_SECRET_ACCESS_KEY - Route 53 IAM secret key for DNS-01 challenge
#   CERTBOT_AWS_ROLE_ARN - IAM role ARN for STS assumption (required by dstack-ingress)
#
# Required GitHub vars:
#   DOCKER_IMAGE - Base image path, e.g. docker.io/username/chipotle
#                  Three images are pushed:
#                    ${DOCKER_IMAGE}-lit-actions
#                    ${DOCKER_IMAGE}-lit-api-server
#                    ${DOCKER_IMAGE}-otel-collector
#   DOCKERHUB_USERNAME - Docker Hub username
#
# Optional GitHub vars — enable zero-downtime ping-pong (else legacy single-CVM in-place deploy):
#   NEXT_CVM_A / NEXT_CVM_B - two instance names sharing one app_id, on any nodes.
#   Exactly one must be running and publicly serving its own cvm_name; the other
#   must be stopped. All bootstrap images must expose /core/v1/version.cvm_name.
#   Both instances' Phala devices MUST be allowlisted on the app's AppAuth contract
#   (`phala cvms device-allowlist`) so the shared app_id derives keys on either node.
#
# Required Phala CVM encrypted env vars (per instance, set via Phala Cloud Dashboard):
#   BASE_CHAIN_RPC             - RPC endpoint for the chain
#   GCP_SERVICE_ACCOUNT_JSON   - GCP service account key (raw JSON or base64-encoded)
#   GCP_PROJECT_ID             - GCP project ID (e.g. "my-gcp-project")
#   STRIPE_SECRET_KEY          - Stripe API secret key (test sandbox for staging, live for prod)
#   STRIPE_PUBLISHABLE_KEY     - Stripe API publishable key (test sandbox for staging, live for prod)
#   CERTBOT_AWS_ACCESS_KEY_ID - Route 53 IAM access key for DNS-01 challenge
#   CERTBOT_AWS_ROLE_ARN      - IAM role ARN for STS assumption (required by dstack-ingress)
#   CERTBOT_AWS_REGION        - AWS region for STS endpoint (e.g. "us-east-1")

name: "Deploy Staging"

# Serialize all deployments to next, including manual runs from other branches. cancel-in-progress is FALSE on purpose: a cutover
# is multi-step (deploy → verify → claim → stop old) and cancelling it midway can
# leave the old instance running / un-stopped. Let an in-flight deploy finish; a
# newer push queues behind it.
concurrency:
  group: deploy-phala-next
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_replica:
        description: "One-time identity bootstrap: require an explicit stopped replica; verify it directly without automatic retirement or rollback. Reconcile public routing and the pair manually afterward."
        required: false
        type: boolean
        default: false
      phala_cvm_name:
        description: "Target Phala CVM name or id to deploy to (e.g. chipotle-next-rep-xxxxx). Leave blank to use the branch default. Use this to deploy onto a freshly-provisioned replica on a new Phala node during a zero-downtime migration."
        required: false
        type: string
        default: ""

jobs:
  validate-secrets:
    runs-on: self-hosted
    steps:
      - name: Validate required secrets
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BASE_CHAIN_RPC: ${{ secrets.BASE_CHAIN_RPC }}
          CERTBOT_AWS_ACCESS_KEY_ID: ${{ secrets.CERTBOT_AWS_ACCESS_KEY_ID }}
          CERTBOT_AWS_SECRET_ACCESS_KEY: ${{ secrets.CERTBOT_AWS_SECRET_ACCESS_KEY }}
          CERTBOT_AWS_ROLE_ARN: ${{ secrets.CERTBOT_AWS_ROLE_ARN }}
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          PHALA_DSTACKAPP_PRIVATE_KEY: ${{ secrets.PHALA_DSTACKAPP_PRIVATE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_SANDBOX_PUBLISHABLE_KEY }}
        run: |
          missing=()
          for secret in GCP_SERVICE_ACCOUNT_JSON BASE_CHAIN_RPC CERTBOT_AWS_ACCESS_KEY_ID CERTBOT_AWS_SECRET_ACCESS_KEY CERTBOT_AWS_ROLE_ARN PHALA_CLOUD_API_KEY PHALA_DSTACKAPP_PRIVATE_KEY STRIPE_SECRET_KEY STRIPE_PUBLISHABLE_KEY; do
            if [ -z "${!secret}" ]; then
              missing+=("$secret")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

  determine-target:
    runs-on: self-hosted
    outputs:
      # target_cvm = the CVM this run deploys to (the COLD one in ping-pong mode).
      # phala_app_name is kept as an alias of target_cvm for backward compat.
      phala_app_name: ${{ steps.set.outputs.target_cvm }}
      target_cvm: ${{ steps.set.outputs.target_cvm }}
      # prev_live_cvm = the instance that was live before this deploy; stopped
      # after the new one is confirmed serving the public domain. Empty in
      # legacy single-CVM mode (nothing to retire).
      prev_live_cvm: ${{ steps.set.outputs.prev_live_cvm }}
      # pingpong = "true" when the instance-pair vars are configured.
      pingpong: ${{ steps.set.outputs.pingpong }}
      base_url: ${{ steps.set.outputs.base_url }}
      api_root_url: ${{ steps.set.outputs.api_root_url }}
      instance_type: ${{ steps.set.outputs.instance_type }}
      gcp_project_id: ${{ steps.set.outputs.gcp_project_id }}
      node_config: ${{ steps.set.outputs.node_config }}
      domain: ${{ steps.set.outputs.domain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Phala CLI
        run: npm install -g phala@1.2.4
      - name: Set deployment target
        id: set
        env:
          INPUT_CVM: ${{ inputs.phala_cvm_name }}
          BOOTSTRAP: ${{ inputs.bootstrap_replica }}
          # The two long-lived instance names (set as repo Actions vars to enable
          # ping-pong; leave unset for legacy single-CVM in-place deploy). Which
          # one is LIVE is derived from DNS at runtime, not stored — see below.
          NEXT_CVM_A: ${{ vars.NEXT_CVM_A }}
          NEXT_CVM_B: ${{ vars.NEXT_CVM_B }}
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          # The `next` git branch is retired; `main` is the deploy branch and
          # targets the chipotle-next staging app (test.chipotle.litprotocol.com),
          # ping-ponged across its two instances. chipotle-dev is deprecated.
          #
          # Auto-deploys only fire on push to main. workflow_dispatch from any
          # branch is permitted (and goes to the same staging CVM) so we can
          # test feature branches against staging before merging — the prior
          # version of this guard claimed to allow that in the error message
          # but the condition itself rejected every non-main ref.
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEFAULT_APP_NAME="chipotle-next-rep-sa6xj"
            CVM_A="$NEXT_CVM_A"; CVM_B="$NEXT_CVM_B"
            echo "instance_type=tdx.small" >> "$GITHUB_OUTPUT"
            echo "gcp_project_id=chipotle-next" >> "$GITHUB_OUTPUT"
            echo "node_config=NodeConfig.next.toml" >> "$GITHUB_OUTPUT"
            DOMAIN="test.chipotle.litprotocol.com"
          else
            echo "Unsupported ref '${{ github.ref }}' — deploy from main (or manual dispatch)."
            exit 1
          fi

          PINGPONG="false"; PREV=""; TARGET="$DEFAULT_APP_NAME"
          if [ "$BOOTSTRAP" = "true" ]; then
            # Explicit, dispatch-only bootstrap for images predating cvm_name.
            # The reference establishes app identity; target must be stopped.
            python3 scripts/phala-pingpong.py bootstrap "$INPUT_CVM" "${CVM_A:-$DEFAULT_APP_NAME}" "https://$DOMAIN"
            TARGET="$INPUT_CVM"
          elif [ -n "$CVM_A" ] || [ -n "$CVM_B" ]; then
            # Fail closed for missing identity, a stale copied replica name,
            # both-running/both-stopped pairs, or a domain outside this pair.
            SELECTION=$(python3 scripts/phala-pingpong.py select \
              "$CVM_A" "$CVM_B" "https://$DOMAIN" "$INPUT_CVM")
            TARGET=$(printf '%s\n' "$SELECTION" | sed -n 's/^target_cvm=//p')
            PREV=$(printf '%s\n' "$SELECTION" | sed -n 's/^prev_live_cvm=//p')
            PINGPONG="true"
          elif [ -n "$INPUT_CVM" ]; then
            TARGET="$INPUT_CVM"
          fi

          echo "target_cvm=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "prev_live_cvm=${PREV}" >> "$GITHUB_OUTPUT"
          echo "pingpong=${PINGPONG}" >> "$GITHUB_OUTPUT"

          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "base_url=https://${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "api_root_url=https://${DOMAIN}/core/v1" >> "$GITHUB_OUTPUT"

  detect-changes:
    needs: [determine-target]
    runs-on: self-hosted
    outputs:
      deploy_needed: ${{ steps.check.outputs.deploy_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if deploy-relevant paths changed
        id: check
        run: |
          API_ROOT_URL="${{ needs.determine-target.outputs.api_root_url }}"

          # For workflow_dispatch (manual trigger), always deploy
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — deploying unconditionally"
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch the currently deployed commit version
          COMMIT_VERSION=$(curl -sf "${API_ROOT_URL}/version" 2>/dev/null | jq -r '.commit_version // empty' 2>/dev/null || true)
          if [ -z "$COMMIT_VERSION" ]; then
            echo "Could not reach /version endpoint — deploying"
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Deployed commit_version: $COMMIT_VERSION"

          # Parse SHA from git describe --always output:
          #   bare SHA: "abc1234" → "abc1234"
          #   describe: "v0.3.14-5-gabc1234" → "abc1234"
          if echo "$COMMIT_VERSION" | grep -qE -- '-g[0-9a-f]+$'; then
            DEPLOYED_SHA=$(echo "$COMMIT_VERSION" | sed 's/.*-g//')
          else
            DEPLOYED_SHA="$COMMIT_VERSION"
          fi

          # Verify the SHA exists in the repo
          if ! git rev-parse --verify "$DEPLOYED_SHA^{commit}" >/dev/null 2>&1; then
            echo "Deployed SHA '$DEPLOYED_SHA' not found in repo history — deploying"
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check for changes in deploy-relevant paths
          DEPLOY_PATHS=(
            lit-actions/
            lit-api-server/
            lit-billing-core/
            lit-core/
            vendor/ipfs-hasher/
            vendor/hickory-proto/
            otel-collector/
            Dockerfile.lit-actions
            Dockerfile.lit-api-server
            Dockerfile.otel-collector
            docker-compose.phala.yml
            scripts/phala-pingpong.py
            .github/workflows/wait-for-api-restart.yml
            .github/workflows/deploy-staging.yml
            .github/workflows/k6-loadtest.yml
            k6/loadtest/
            k6/setup.ts
          )
          CHANGED=$(git diff --name-only "$DEPLOYED_SHA" HEAD -- "${DEPLOY_PATHS[@]}")
          if [ -n "$CHANGED" ]; then
            echo "Deploy-relevant changes detected:"
            echo "$CHANGED"
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No deploy-relevant changes since $DEPLOYED_SHA — skipping build & deploy"
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [validate-secrets, determine-target, detect-changes]
    if: needs.detect-changes.outputs.deploy_needed == 'true'
    runs-on: self-hosted
    permissions:
      id-token: write  # required for Sigstore keyless signing (OIDC token)
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: lit-actions
            dockerfile: Dockerfile.lit-actions
          - service: lit-api-server
            dockerfile: Dockerfile.lit-api-server
          - service: otel-collector
            dockerfile: Dockerfile.otel-collector
    steps:
      # Check out by commit SHA, not by tag ref. actions/checkout@v4 does a
      # "ref fixup" fetch that overwrites annotated tag refs with raw commit
      # pointers (git fetch origin +<sha>:refs/tags/<tag>), which causes
      # git describe --always to skip the tag. Checking out by SHA avoids the
      # fixup entirely, keeping annotated tags intact for git_version!().
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKER_IMAGE }}-${{ matrix.service }}:${{ github.sha }}
          build-args: |
            ${{ matrix.service == 'lit-api-server' && format('NODE_CONFIG={0}', needs.determine-target.outputs.node_config) || '' }}

      - name: Sign image with Sigstore (keyless)
        run: |
          cosign sign --yes \
            "${{ vars.DOCKER_IMAGE }}-${{ matrix.service }}@${{ steps.push.outputs.digest }}"

      - name: Save image digest
        run: echo "${{ steps.push.outputs.digest }}" > digest-${{ matrix.service }}.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}
          path: digest-${{ matrix.service }}.txt

  deploy:
    needs: [determine-target, build, detect-changes]
    if: needs.detect-changes.outputs.deploy_needed == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true

      - name: Prepare docker-compose for deployment (digest-pinned)
        run: |
          DIGEST_LIT_ACTIONS=$(cat digest-lit-actions.txt | tr -d '\n' | sed 's/}[}]*$//')
          DIGEST_LIT_API_SERVER=$(cat digest-lit-api-server.txt | tr -d '\n' | sed 's/}[}]*$//')
          DIGEST_OTEL_COLLECTOR=$(cat digest-otel-collector.txt | tr -d '\n' | sed 's/}[}]*$//')
          DOMAIN="${{ needs.determine-target.outputs.domain }}"
          sed \
            -e "s|\${DOCKER_IMAGE_LIT_ACTIONS}|${{ vars.DOCKER_IMAGE }}-lit-actions@${DIGEST_LIT_ACTIONS}|g" \
            -e "s|\${DOCKER_IMAGE_LIT_API_SERVER}|${{ vars.DOCKER_IMAGE }}-lit-api-server@${DIGEST_LIT_API_SERVER}|g" \
            -e "s|\${DOCKER_IMAGE_OTEL_COLLECTOR}|${{ vars.DOCKER_IMAGE }}-otel-collector@${DIGEST_OTEL_COLLECTOR}|g" \
            -e "s|\${GCP_PROJECT_ID}|${{ needs.determine-target.outputs.gcp_project_id }}|g" \
            -e "s|\${CERTBOT_DOMAIN}|${DOMAIN}|g" \
            -e "s|\${CERTBOT_AWS_REGION}|${{ vars.CERTBOT_AWS_REGION }}|g" \
            docker-compose.phala.yml > docker-compose.deploy.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Phala CLI
        run: npm install -g phala@1.2.4

      - name: Deploy to Phala Cloud
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          PHALA_PRIVATE_KEY: ${{ secrets.PHALA_DSTACKAPP_PRIVATE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_SANDBOX_PUBLISHABLE_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BASE_CHAIN_RPC: ${{ secrets.BASE_CHAIN_RPC }}
          CERTBOT_AWS_ACCESS_KEY_ID: ${{ secrets.CERTBOT_AWS_ACCESS_KEY_ID }}
          CERTBOT_AWS_SECRET_ACCESS_KEY: ${{ secrets.CERTBOT_AWS_SECRET_ACCESS_KEY }}
          CERTBOT_AWS_ROLE_ARN: ${{ secrets.CERTBOT_AWS_ROLE_ARN }}
          LIT_INTERNAL_SHARED_SECRET: ${{ secrets.LIT_INTERNAL_SHARED_SECRET }}
        run: |
          # Shared gateway IP makes the per-IP new-account limit a global cap.
          # PHALA_CVM_NAME (the CVM deployed to) names this replica in OTEL logs.
          phala deploy \
            -c docker-compose.deploy.yml \
            --cvm-id ${{ needs.determine-target.outputs.phala_app_name }} \
            --private-key "$PHALA_PRIVATE_KEY" \
            -e "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" \
            -e "STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY" \
            -e "GCP_SERVICE_ACCOUNT_JSON=$GCP_SERVICE_ACCOUNT_JSON" \
            -e "GCP_PROJECT_ID=${{ needs.determine-target.outputs.gcp_project_id }}" \
            -e "BASE_CHAIN_RPC=$BASE_CHAIN_RPC" \
            -e "CERTBOT_DOMAIN=${{ needs.determine-target.outputs.domain }}" \
            -e "CERTBOT_AWS_ACCESS_KEY_ID=$CERTBOT_AWS_ACCESS_KEY_ID" \
            -e "CERTBOT_AWS_SECRET_ACCESS_KEY=$CERTBOT_AWS_SECRET_ACCESS_KEY" \
            -e "CERTBOT_AWS_ROLE_ARN=$CERTBOT_AWS_ROLE_ARN" \
            -e "CERTBOT_AWS_REGION=${{ vars.CERTBOT_AWS_REGION }}" \
            -e "LIT_INTERNAL_SHARED_SECRET=$LIT_INTERNAL_SHARED_SECRET" \
            -e "PHALA_CVM_NAME=${{ needs.determine-target.outputs.phala_app_name }}" \
            -e "NEW_ACCOUNT_RATE_LIMIT_ENABLED=false"

      - name: Start updated CVM if stopped
        shell: bash
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          PHALA_APP_NAME: ${{ needs.determine-target.outputs.phala_app_name }}
        run: |
          # Updates preserve the VM's power state. Wait for the update to settle
          # before starting a stopped target; leave running instances alone.
          for attempt in {1..60}; do
            STATUS=$(phala cvms get "$PHALA_APP_NAME" --json | jq -er '.status')
            case "$STATUS" in
              stopped)
                phala cvms start "$PHALA_APP_NAME"
                exit 0
                ;;
              running) exit 0 ;;
              starting|stopping|updating|restarting|processing) sleep 5 ;;
              *)
                echo "::error::Unexpected CVM status '$STATUS' for '$PHALA_APP_NAME'"
                exit 1
                ;;
            esac
          done
          echo "::error::Timed out waiting for '$PHALA_APP_NAME' to settle after update"
          exit 1

  wait-for-api-available:
    needs: [deploy, determine-target, detect-changes]
    # Only verify when a deploy actually happened. The cold instance is normally
    # STOPPED between deploys, so on a no-op push (deploy_needed=false) there is
    # nothing running at the cold URL to check — skip the whole verify chain.
    if: ${{ needs.detect-changes.outputs.deploy_needed == 'true' && needs.deploy.result == 'success' }}
    uses: ./.github/workflows/wait-for-api-restart.yml
    with:
      # Verify the freshly-deployed (cold) CVM on its OWN default Phala URL
      # (*-8000.*.phala.network), not the shared public domain — which the old
      # instance still owns until cutover. wait-for-api-restart resolves the
      # direct URL from the CVM name via `phala cvms get`.
      phala_app_name: ${{ needs.determine-target.outputs.target_cvm }}
      expected_cvm_name: ${{ needs.determine-target.outputs.target_cvm }}
      expected_sha: ${{ needs.detect-changes.outputs.deploy_needed == 'true' && github.sha || '' }}
      runner: '["self-hosted"]'
    secrets:
      PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}

  verify-attestation:
    needs: [wait-for-api-available, determine-target]
    uses: ./.github/workflows/verify-attestation.yml
    with:
      # Attest the cold box directly (its resolved default URL), pre-cutover.
      base_url: ${{ needs.wait-for-api-available.outputs.base_url }}
      runner: '["self-hosted"]'

  openapi-spec-check:
    needs: [wait-for-api-available]
    uses: ./.github/workflows/openapi-spec-check.yml
    with:
      api_root_url: ${{ needs.wait-for-api-available.outputs.api_root_url }}
      runner: '["self-hosted"]'

  k6-smoke:
    needs: [wait-for-api-available, openapi-spec-check]
    uses: ./.github/workflows/k6-smoke.yml
    with:
      api_root_url: ${{ needs.wait-for-api-available.outputs.api_root_url }}

  k6-correctness:
    needs: [wait-for-api-available, k6-smoke]
    uses: ./.github/workflows/k6-correctness.yml
    with:
      api_root_url: ${{ needs.wait-for-api-available.outputs.api_root_url }}

  # Latency regression gate. Runs a low-VU soak against the freshly-deployed
  # (cold) instance on its OWN direct URL (not the public domain). Note the cold
  # box auto-claims the public domain at boot — before this gate runs — so a bad
  # build may already be serving public traffic by now; this gate does NOT
  # prevent that. What it does: a load-test failure blocks confirm-cutover and
  # triggers rollback-on-failure below, which flips the public domain back to the
  # still-running old instance. So it's detect-and-roll-back, not prevent-go-live.
  #
  # Why soak (low VU) and not spike: spike (25 VUs of real crypto) saturates the
  # small staging box and trips lit-api-server's CPU load-shedding guard (429s),
  # which measures the failure cliff, not latency — and the fast 429s actually
  # mask "got slower" regressions. A low-VU soak stays under the shed threshold
  # so per-endpoint p95 reflects the code path. SCENARIO=soak drops the spec's
  # ramp_* scenarios. The p95 ceilings live in soak.spec.ts (interim absolute
  # bounds; Phase 2 swaps them for run-over-run deltas vs a baseline).
  k6-loadtest:
    needs: [wait-for-api-available, k6-correctness]
    uses: ./.github/workflows/k6-loadtest.yml
    with:
      api_root_url: ${{ needs.wait-for-api-available.outputs.api_root_url }}
      test: soak
      vus: '2'
      duration: 3m
      scenario: soak
      # Create ephemeral accounts against the freshly-deployed box rather than
      # relying on the pre-seeded pool, which may not exist on this instance and
      # would 401 → false rollback.
      create_accounts: ${{ 'true' }}
      # Phase 2: fail on a p95 regression vs the committed baseline (delta gate)
      # rather than the staging-tuned absolute ceilings. Path is relative to
      # k6/loadtest/ (where the spec's open() resolves from). Refresh the
      # baseline with k6/update-soak-baseline.sh.
      baseline_file: ../baselines/soak.next.json

  # Record the soak gate result as a commit status on this SHA, so a prod release
  # can require that the soak JOB actually ran green on the exact commit being
  # released (not just that the overall Deploy Staging run concluded success,
  # which is also true when the gate was SKIPPED for a no-deploy-relevant change).
  # Skipped when k6-loadtest is skipped (deploy_needed=false) → no status posted →
  # release-time precheck fails closed. See deploy-prod-1-propose.yml.
  mark-perf-gate:
    needs: [k6-loadtest]
    # Only stamp the trusted status from a main deploy (push or dispatch on main);
    # a workflow_dispatch run on a feature branch must not be able to forge
    # perf-gate/soak on its SHA. Skipped (no status) when the soak was skipped.
    if: ${{ always() && needs.k6-loadtest.result != 'skipped' && github.ref == 'refs/heads/main' }}
    runs-on: self-hosted
    permissions:
      statuses: write
    steps:
      - name: Post perf-gate/soak commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RESULT: ${{ needs.k6-loadtest.result }}
        run: |
          state=$([ "$RESULT" = "success" ] && echo success || echo failure)
          echo "soak gate result=$RESULT → posting perf-gate/soak=$state on $SHA"
          gh api -X POST "repos/${GH_REPO}/statuses/${SHA}" \
            -f state="$state" \
            -f context="perf-gate/soak" \
            -f description="k6 soak perf gate: $RESULT" \
            -f target_url="https://github.com/${GH_REPO}/actions/runs/${{ github.run_id }}"

  # Both replicas can serve during overlap. Verify the expected identity/build
  # publicly before retirement, then verify public health again after OLD stops.
  confirm-cutover:
    needs: [determine-target, detect-changes, wait-for-api-available, verify-attestation, openapi-spec-check, k6-smoke, k6-correctness, k6-loadtest]
    if: ${{ needs.determine-target.outputs.pingpong == 'true' && needs.detect-changes.outputs.deploy_needed == 'true' }}
    uses: ./.github/workflows/wait-for-api-restart.yml
    with:
      api_root_url: ${{ needs.determine-target.outputs.api_root_url }}
      expected_sha: ${{ github.sha }}
      expected_cvm_name: ${{ needs.determine-target.outputs.target_cvm }}
      timeout: 300
      runner: '["self-hosted"]'

  stop-old-cvm:
    needs: [determine-target, detect-changes, confirm-cutover]
    if: ${{ needs.determine-target.outputs.pingpong == 'true' && needs.determine-target.outputs.prev_live_cvm != '' && needs.detect-changes.outputs.deploy_needed == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g phala@1.2.4
      - name: Verify target identity, retire previous instance, verify public health
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          OLD: ${{ needs.determine-target.outputs.prev_live_cvm }}
          NEW: ${{ needs.determine-target.outputs.target_cvm }}
          PUBLIC_URL: ${{ needs.determine-target.outputs.base_url }}
        run: python3 scripts/phala-pingpong.py retire "$OLD" "$NEW" "$PUBLIC_URL"

  # Recovery also covers deployment/readiness and retirement failures.
  rollback-on-failure:
    needs: [determine-target, detect-changes, deploy, wait-for-api-available, verify-attestation, openapi-spec-check, k6-smoke, k6-correctness, k6-loadtest, confirm-cutover, stop-old-cvm]
    if: >-
      ${{ always()
          && needs.determine-target.outputs.pingpong == 'true'
          && needs.detect-changes.outputs.deploy_needed == 'true'
          && needs.determine-target.outputs.prev_live_cvm != ''
          && (needs.deploy.result == 'failure'
              || needs.wait-for-api-available.result == 'failure'
              || needs.confirm-cutover.result == 'failure'
              || needs.stop-old-cvm.result == 'failure'
              || needs.verify-attestation.result == 'failure'
              || needs.openapi-spec-check.result == 'failure'
              || needs.k6-smoke.result == 'failure'
              || needs.k6-correctness.result == 'failure'
              || needs.k6-loadtest.result == 'failure') }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Phala CLI + AWS CLI
        run: |
          npm install -g phala@1.2.4
          # AWS CLI v2 via the official installer (no Python dependency). The old
          # `pip install --user awscli` fails on the runner's externally-managed
          # Python (PEP 668: "externally-managed-environment"). Guarded so a
          # pre-installed aws is reused; --update keeps it idempotent across reruns
          # on a persistent self-hosted $HOME.
          if ! command -v aws >/dev/null 2>&1; then
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            curl -fsSL --retry 3 "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "$tmp/awscliv2.zip"
            unzip -q "$tmp/awscliv2.zip" -d "$tmp"
            "$tmp/aws/install" --update --install-dir "$HOME/.local/aws-cli" --bin-dir "$HOME/.local/bin"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Recover previous instance and remove failed target
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CERTBOT_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CERTBOT_AWS_SECRET_ACCESS_KEY }}
          CERTBOT_AWS_ROLE_ARN: ${{ secrets.CERTBOT_AWS_ROLE_ARN }}
          AWS_DEFAULT_REGION: ${{ vars.CERTBOT_AWS_REGION }}
          OLD: ${{ needs.determine-target.outputs.prev_live_cvm }}
          NEW: ${{ needs.determine-target.outputs.target_cvm }}
          PUBLIC_URL: ${{ needs.determine-target.outputs.base_url }}
        run: python3 scripts/phala-pingpong.py rollback "$OLD" "$NEW" "$PUBLIC_URL"
