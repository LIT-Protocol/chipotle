name: Keychain
on:
  pull_request:
    paths:
      - 'lit-agent-keychain/**'
      - 'lit-actions/**'
      - 'vendor/ipfs-hasher/**'
      - 'vendor/hickory-proto/**'
      - '.github/workflows/keychain-ci.yml'
permissions:
  contents: read
concurrency:
  group: keychain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  keychain:
    # Playwright 1.58.2 supports Ubuntu 24.04, but not 26.04.
    # Keep browser dependencies stable when ubuntu-latest moves forward.
    runs-on: ubuntu-24.04
    env:
      # Both Rust workspaces remain on disk for the Deno fixture. Omit debug
      # symbols, not debug assertions, to fit the hosted runner's disk budget.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: keychain_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: keychain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U keychain_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: lit-agent-keychain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lit-agent-keychain/package-lock.json
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt, clippy
      - run: npm ci
      - name: npm audit (exceptions in npm-audit-allowlist.json)
        run: npx tsx scripts/npm-audit.ts
      - run: npm run format:check
      - run: npm test
      - name: SDK version bumped if packed contents changed (merge publishes)
        env:
          PR_REPOSITORY: ${{ github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Private source deliberately retains explanations omitted from the
          # public npm README and source maps. An unchanged Keychain tree must
          # not require a release merely because those baseline bytes differ.
          # Compare the whole tree, including build scripts, lockfiles, protocol
          # and actions, not just sdk/. Public PRs always check npm directly.
          # Cargo.lock is left out: the Rust lockfile is not an input to the
          # npm package, so a Rust dependency update alone needs no release.
          if [ "$PR_REPOSITORY" = "LIT-Protocol/chipotle-private" ]; then
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            if git diff --quiet "$PR_BASE_SHA" HEAD -- ':(top)lit-agent-keychain' \
              ':(top,exclude)lit-agent-keychain/Cargo.lock'; then
              echo "Keychain tree unchanged from private PR base; no SDK release required."
              exit 0
            else
              diff_status=$?
              # Exit 1 means changed; other errors must not bypass the check.
              [ "$diff_status" -eq 1 ] || exit "$diff_status"
            fi
          fi
          node scripts/publish-sdk.mjs --check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: npx playwright install --with-deps chromium
      - name: Passkey discovery and recovery regression tests
        run: npx playwright test --config tests/passkey.playwright.config.ts
      - run: node scripts/test-local.mjs
        env:
          KEYCHAIN_TEST_DATABASE_URL: postgres://keychain_test:local-test-only@127.0.0.1:5432/keychain_test
      - name: Real Stripe test-mode subscription contract
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          KEYCHAIN_TEST_DATABASE_URL: postgres://keychain_test:local-test-only@127.0.0.1:5432/keychain_test
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "Stripe test key unavailable; live contract test skipped."
            exit 0
          fi
          node scripts/cleanup-stripe-tests.mjs
          cargo test --locked --test stripe_live -- --ignored
      - name: Actual Lit Deno runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsqlite3-dev libclang-dev protobuf-compiler
          npm run test:runtime
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: keychain-browser-failures
          path: lit-agent-keychain/test-results
