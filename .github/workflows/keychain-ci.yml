name: Keychain v2
on:
  pull_request:
    paths:
      - 'lit-agent-keychain/**'
      - 'lit-actions/**'
      - 'vendor/ipfs-hasher/**'
      - '.github/workflows/keychain-ci.yml'
permissions:
  contents: read
concurrency:
  group: keychain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  keychain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: keychain_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: keychain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U keychain_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: lit-agent-keychain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lit-agent-keychain/package-lock.json
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run format:check
      - run: npm test
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-local.mjs
        env:
          KEYCHAIN_TEST_DATABASE_URL: postgres://keychain_test:local-test-only@127.0.0.1:5432/keychain_test
      - name: Real Stripe test-mode subscription contract
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          KEYCHAIN_TEST_DATABASE_URL: postgres://keychain_test:local-test-only@127.0.0.1:5432/keychain_test
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "Stripe test key unavailable; live contract test skipped."
            exit 0
          fi
          node scripts/cleanup-stripe-tests.mjs
          cargo test --locked --test stripe_live -- --ignored
      - name: Actual Lit Deno runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsqlite3-dev libclang-dev protobuf-compiler
          npm run test:runtime
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: keychain-browser-failures
          path: lit-agent-keychain/test-results
