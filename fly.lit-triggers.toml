# Fly.io config for the lit-triggers service.
#
# Deploy from the repository root with:
#   fly deploy -c fly.lit-triggers.toml
#
# The app name below is the default/public beta name. Override with `-a <app>`
# or edit this file if the Fly app is created under a different name.

app = "lit-triggers"
primary_region = "iad"

[build]
  dockerfile = "lit-triggers/Dockerfile"

[env]
  ROCKET_ADDRESS = "0.0.0.0"
  RUST_LOG = "info,lit_triggers=info"
  CHIPOTLE_API_BASE_URL = "https://api.chipotle.litprotocol.com"

  # Webhook admission-control defaults. Tune per deployment if needed.
  WEBHOOK_MAX_BODY_BYTES = "262144"
  WEBHOOK_IP_MAX_REQUESTS_PER_MINUTE = "60"
  WEBHOOK_USER_MAX_REQUESTS_PER_MINUTE = "120"
  WEBHOOK_TRIGGER_MAX_REQUESTS_PER_MINUTE = "60"
  WEBHOOK_DEFAULT_MAX_QUEUED_RUNS = "100"

  # Chain-event polling defaults.
  CHAIN_POLL_INTERVAL_SECS = "15"
  CHAIN_CONFIRMATION_DEPTH = "12"
  CHAIN_MAX_BLOCK_RANGE = "500"
  CHAIN_RPC_TIMEOUT_SECS = "10"
  CHAIN_INITIAL_LOOKBACK_BLOCKS = "100"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
