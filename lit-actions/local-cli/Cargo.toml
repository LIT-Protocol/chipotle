# Standalone workspace: this is a local developer tool, intentionally
# decoupled from the lit-actions workspace build (and from the unmerged
# gvisor-server crate it mirrors — see PR #557). Its `lit` binary would
# otherwise collide with gvisor-server's guest `lit` binary in a shared
# target dir.
[workspace]

[package]
name = "lit-actions-local-cli"
description = "Local stand-in for the sandbox guest `lit` CLI: run and test any-language Lit Actions on your laptop, with keys derived from a local private key"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "lit"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
alloy = { version = "1.0", default-features = false, features = ["signer-local"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
