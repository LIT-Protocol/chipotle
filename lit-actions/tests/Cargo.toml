[package]
name = "lit-actions-tests"
description = "Lit Actions tests"
version = { workspace = true }
edition = { workspace = true }
publish = { workspace = true }
autotests = false

[[test]]
name = "integration"
path = "it.rs"

[[bench]]
name = "execute_js"
path = "bench.rs"
harness = false

[dependencies]
anyhow = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
ctor = "0.2"
deno_resolver = { workspace = true }
deno_runtime = { workspace = true }
flume = { workspace = true }
gotham_store = "1"
indoc = { workspace = true }
# Signing fixture attestations for the email-approval op tests
k256 = { version = "0.13", features = ["ecdsa"] }
lit-actions-server = { workspace = true }
lit-core = { workspace = true }
pretty_assertions = "1"
pretty_env_logger = "0.5"
rstest = "0.19"
serde_json = { workspace = true }
sys_traits = { workspace = true }
temp-file = "0.1"
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
wiremock = "0.6"

[build-dependencies]
lit-actions-snapshot = { workspace = true }
