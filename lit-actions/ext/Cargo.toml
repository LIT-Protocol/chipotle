[package]
name = "lit-actions-ext"
description = "Lit Actions Deno extension"
version = { workspace = true }
edition = { workspace = true }
publish = { workspace = true }

[lib]
path = "lib.rs"
doctest = false

[dependencies]
deno_core = { workspace = true }
deno_error = { workspace = true }
ethabi = { version = "18", default-features = false, features = ["serde"] }
flume = { workspace = true }
lazy_static = "1"
lit-actions-grpc = { workspace = true }
lit-observability = { workspace = true, features = ["channels"] }
# Percent-decoding of proxy userinfo (user:pass) — generated proxy passwords
# routinely contain reserved chars (@ : / +) that arrive %-encoded in the URL.
percent-encoding = "2"
# Matches lit-actions/server's reqwest exactly so feature-unification is a no-op
# and we reuse the process-default aws_lc_rs provider installed in init_v8().
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
# Egress-filter DNS resolution for proxiedFetch (CPL-295): async getaddrinfo via
# tokio's blocking pool, matching how reqwest/deno resolve.
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
