# cargo-deny configuration.
#
# Scope: advisory + source-allowlist checks only. License and ban checks are
# intentionally not enabled here so this config does not block builds on
# unrelated policy decisions — tighten later if/when we want that coverage.
#
# Run locally:    cargo deny check --config <repo-root>/deny.toml advisories sources
# CI invocation:  see .github/workflows/rust-ci.yml

[graph]
all-features = true

[advisories]
# RustSec advisory database. Vulnerabilities still fail the build by default;
# yanked crates warn (the lockfile can lag a yank by hours).
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

# Pre-existing advisory backlog captured on 2026-05-19 across all four cargo
# workspaces (lit-actions, lit-core, lit-api-server, rust_generator_and_deployer).
# Every entry here should be triaged and either resolved (cargo update / dep
# bump) or kept with explicit justification. Advisories published AFTER this
# snapshot will NOT be in this list, so they will fail CI — that is the point.
#
# History:
# - 2026-05-19: initial snapshot, 34 advisories.
# - 2026-05-19: lockfile bumps via `cargo update -p` cleared RUSTSEC-2026-{0007,
#   0037,0067,0068} (bytes / quinn-proto / tar / tar) across all workspaces,
#   and RUSTSEC-2026-0009 (time) in lit-core and lit-api-server. Picked up
#   RUSTSEC-2024-0388 (derivative unmaintained, transitive via ark-ff). The
#   time bump in lit-actions had to be reverted because `time --precise 0.3.47`
#   cascaded serde to 1.0.228, which broke compilation of `swc_config 0.1.15`
#   and `swc_common 0.37.5` (transitives via deno_ast → deno_runtime — they
#   re-export the removed `serde::__private` module). Real fix is bumping
#   deno_runtime; until then time stays at 0.3.44 in lit-actions and
#   RUSTSEC-2026-0009 stays in the ignore list. Net: 31 active.
# - 2026-05-25: removed Rust ethers-rs from lit-api-server and lit-core.
#   RUSTSEC-2023-0071 remains via `dcap-qvl` dev deps, and
#   RUSTSEC-2026-{0049,0098,0099,0104} remain via non-ethers rustls users
#   (`rocket`/`reqwest`/Alloy chains). Net remains 31 active, but no remaining
#   ignored advisory is justified by ethers.
# - 2026-06-09: removed stale entries for crates no longer present in any
#   current Rust workspace lockfile: RUSTSEC-2025-{0056,0057,0075,0080,0081,
#   0098,0100}. Added RUSTSEC-2026-0173 (proc-macro-error2, via Alloy) and
#   RUSTSEC-2026-0174 (http-types, via wiremock test dependency).
# - 2026-06-08: "Tier 1" lockfile bumps (no Cargo.toml changes):
#   * keccak 0.1.5 -> 0.1.6 in lit-actions/lit-core/lit-api-server cleared
#     RUSTSEC-2026-0012 in every workspace -> entry removed.
#   * rustls-webpki 0.103.9 -> 0.103.13 in lit-api-server fully cleared
#     RUSTSEC-2026-0049 there and the 0.103-line half of 0098/0099/0104;
#     the 0.101.7 copy (rocket 0.5.1 -> rustls 0.21) and deno's 0.102.8
#     (lit-actions) still fire those, so they stay — reasons corrected below.
#   * rand 0.8.5 -> 0.8.6 and 0.9.2 -> 0.9.4 in lit-api-server cleared
#     RUSTSEC-2026-0097 there; lit-actions pins rand 0.8.5 and Alloy pulls
#     rand into the generator/payments graphs, so the entry stays.
#   Also removed three stale entries now advisory-not-detected in all six CI
#   workspaces: RUSTSEC-2024-0388 (derivative), RUSTSEC-2025-0009 (aes),
#   RUSTSEC-2025-0010 (ring <0.17).
# - 2026-06-08: "Tier 2" in-house fixes that removed four more entries:
#   * lit-actions/ext dropped the `atty` dep for std::io::IsTerminal ->
#     cleared RUSTSEC-2021-0145 and RUSTSEC-2024-0375 (atty was only used
#     there).
#   * lit-actions test dep wiremock 0.5 -> 0.6 dropped the old
#     instant/http-types/rand 0.7.3 chain -> cleared RUSTSEC-2024-0384
#     (instant) and RUSTSEC-2026-0174 (http-types).
#   * lit-core-derive was reworked off the abandoned proc-macro-error onto
#     plain syn::Error/compile_error!. RUSTSEC-2024-0370 still fires, but now
#     only via multihash-derive 0.8.1 (LIT rust-ipfs-api fork's multihash
#     0.17 chain in lit-core) — reason updated, entry kept.
# - 2026-06-08: migrated lit-core (utils/cache.rs, utils/ipfs.rs) and
#   lit-api-core (http/tls/certs.rs) off the discontinued async-std onto
#   tokio (tokio::fs / tokio::io / tokio::time, fs4's "tokio" feature, and
#   futures::StreamExt for the IPFS stream). async-std is gone from every
#   workspace graph -> removed RUSTSEC-2025-0052.
# - 2026-06-09: lit-actions now consumes deno from crates.io (deno_core
#   =0.401.0 / deno_runtime =0.256.0), not the LIT deno_core fork. The fork is
#   referenced in NO lockfile in this repo, so removed the dead allow-git entry
#   "https://github.com/Lit-Protocol/deno_core" from [sources] below.
#   Investigated whether bumping deno to the latest published patch
#   (deno_core 0.403.0 / deno_runtime 0.258.0) clears the deno-chain advisories
#   (2026-0009 time, 2026-0097 rand, 2026-0118/0119 hickory, 2025-0141 bincode,
#   2026-0049/0098/0099/0104 rustls-webpki). It does NOT: the latest deno still
#   hard-pins every vulnerable version — rand =0.8.5 (deno_crypto/deno_kv),
#   rustls-webpki ^0.102 via rustls =0.23.40 (deno_tls; ^0.102 excludes the
#   fixed 0.103 line), hickory ^0.25.2 (no non-beta fix exists for 0.118),
#   bincode 1.x (deno_kv; no fix outside the 2.x rewrite), and deno_ast =0.53.2
#   still drags the swc/serde chain that breaks when time goes >=0.3.47. These
#   eight advisory entries therefore cannot be removed by a deno bump and stay
#   until deno upstream bumps its own deps.
#
# Suggested triage order: vulnerabilities > unsound > unmaintained.
ignore = [
    # ── vulnerabilities ───────────────────────────────────────────────────────
    { id = "RUSTSEC-2023-0071", reason = "Marvin Attack timing sidechannel in rsa — still present via dcap-qvl dev dependency; pre-existing" },
    { id = "RUSTSEC-2026-0009", reason = "time DoS via stack exhaustion — still present in lit-actions (time 0.3.47 cascades serde 1.0.228 which breaks swc_config/swc_common from deno chain); cleared in lit-core and lit-api-server" },
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki CRL distribution-point matching — now only via deno_runtime's rustls-webpki 0.102.8 in lit-actions; cleared elsewhere by bumping rustls-webpki 0.103.9->0.103.13" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki URI name constraints — via deno's 0.102.8 (lit-actions) and rocket 0.5.1's rustls 0.21 -> rustls-webpki 0.101.7 (lit-api-server); 0.103 line cleared via cargo update" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki wildcard name constraints — via deno's 0.102.8 (lit-actions) and rocket 0.5.1's rustls 0.21 -> rustls-webpki 0.101.7 (lit-api-server); 0.103 line cleared via cargo update" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki CRL parsing panic — via deno's 0.102.8 (lit-actions) and rocket 0.5.1's rustls 0.21 -> rustls-webpki 0.101.7 (lit-api-server); 0.103 line cleared via cargo update" },
    { id = "RUSTSEC-2026-0118", reason = "hickory NSEC3 unbounded loop — no upstream fix yet" },
    { id = "RUSTSEC-2026-0119", reason = "hickory DNS O(n^2) name compression — pinned by deno_runtime chain" },

    # ── unsound ───────────────────────────────────────────────────────────────
    { id = "RUSTSEC-2019-0036", reason = "failure type confusion — transitive; pre-existing" },
    { id = "RUSTSEC-2026-0097", reason = "rand custom logger unsound — still present via rand 0.8.5 pinned in lit-actions and Alloy's rand in generator/payments; cleared in lit-api-server after rand 0.8.5->0.8.6 / 0.9.2->0.9.4" },

    # ── unmaintained ──────────────────────────────────────────────────────────
    { id = "RUSTSEC-2020-0036", reason = "failure deprecated — transitive; pre-existing" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained — lit-core-derive no longer uses it; now only via multihash-derive 0.8.1 in the LIT rust-ipfs-api fork's multihash 0.17 chain (lit-core), same blocker as RUSTSEC-2026-0105" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained — pre-existing" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained — pre-existing" },
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained — pre-existing" },
    { id = "RUSTSEC-2026-0105", reason = "core2 unmaintained, all versions yanked — pre-existing" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained — transitive via alloy-sol-macro; no safe upgrade available" },
]

[sources]
# Block any non-crates.io registry and any git dep not on the explicit allow
# list below. New git deps must be added here, which forces a review.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/LIT-Protocol/bulletproofs",
    "https://github.com/LIT-Protocol/env_logger",
    "https://github.com/LIT-Protocol/rust-ipfs-api",
    "https://github.com/LIT-Protocol/zerossl",
    "https://github.com/integer32llc/libffi-rs",
]
