# Fly.io config for the lit-payments service.
#
# Lives at the repo root because the lit-payments Dockerfile expects the repo
# root as the build context (so it can COPY the sibling lit-billing-core crate).
# Deploy from the repo root:  fly deploy
#
# If/when other services move to Fly, rename this file (e.g.
# fly.lit-payments.toml) and deploy each with `fly deploy -c <file>`.

app = "lit-payments"
primary_region = "iad"  # adjust to whichever region is closest to Lit's user base

[build]
  dockerfile = "lit-payments/Dockerfile"

[env]
  # Bind to all interfaces so Fly's ingress can reach the container.
  ROCKET_ADDRESS = "0.0.0.0"
  RUST_LOG = "info"

# Fly sets PORT to whatever internal_port is below; main.rs's
# apply_platform_env() translates PORT -> ROCKET_PORT.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# Smallest VM is plenty for an internal ops tool. Bump if traffic grows.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
