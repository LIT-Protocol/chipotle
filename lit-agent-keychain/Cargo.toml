[package]
name = "lit-agent-keychain"
version = "2.0.0"
default-run = "lit-agent-keychain"
edition = "2021"
description = "Owner-authorized, action-bound encrypted credentials for agents"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
hmac = "0.12"
ed25519-dalek = "2.2"
hex = "0.4"
ipfs-hasher = "0.13.0"
k256 = { version = "0.13", features = ["ecdsa"] }
moka = { version = "0.12", features = ["future"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "time", "json", "macros"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Keep action CIDs consistent at exact UnixFS chunk boundaries.
[patch.crates-io]
ipfs-hasher = { path = "../vendor/ipfs-hasher" }
