[package]
name = "lit-bridge"
version = "0.1.0"
edition = "2021"
description = "Permissionless cross-chain token bridge: hosted bridging UI + verification oracle (action/) + config registry (contracts/). Stateless — bridge state lives on-chain."
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
