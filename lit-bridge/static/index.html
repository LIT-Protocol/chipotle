<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lit-bridge</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>lit-bridge</h1>
        <button id="connect" class="ghost">Connect wallet</button>
      </header>
      <p class="tag">Permissionless cross-chain token bridge — verified by a Lit Action, not a validator set.</p>

      <section id="notconfigured" class="card hidden">
        <p>No chains configured. Set <code>CHAINS_JSON</code> on the service to enable bridging.</p>
      </section>

      <section id="bridge" class="card hidden">
        <div class="row">
          <label>From<select id="from"></select></label>
          <button id="swap" class="ghost" title="Swap direction">⇄</button>
          <label>To<select id="to"></select></label>
        </div>
        <label class="amount">Amount
          <input id="amount" type="text" inputmode="decimal" placeholder="0.0" />
          <span id="balance" class="muted"></span>
        </label>
        <label>Recipient (on destination)
          <input id="recipient" type="text" placeholder="0x… (defaults to your address)" />
        </label>
        <div id="quote" class="muted"></div>
        <button id="go" disabled>Connect a wallet to bridge</button>
        <div id="status" class="status"></div>
      </section>

      <footer>
        <span id="feenote" class="muted"></span>
        <a href="https://github.com/LIT-Protocol/chipotle" target="_blank" rel="noreferrer">How it works</a>
      </footer>
    </main>
    <script src="/static/bridge.js"></script>
  </body>
</html>
