[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
cache_path = "cache_forge"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# OpenZeppelin v5 uses Cancun's mcopy; Base + Arbitrum (Sepolia + mainnet) all
# support Cancun.
evm_version = "cancun"
auto_detect_solc = false
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
